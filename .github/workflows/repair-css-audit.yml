name: One-shot CSS audit repair

on:
  push:
    paths:
      - '.github/workflows/repair-css-audit.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair canonical CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/assets/css/lc.css')
          s=p.read_text()
          root=s.find(':root{')
          if root < 0:
              raise SystemExit('Canonical :root block not found')
          prefix='@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=optional");\n\n/* LC — Learn & Create\n   Canonical stylesheet. Legacy visual files were consolidated here on 2026-08-31.\n   Order is intentional: brand tokens → structural base → components → learning → Design System 2.0.\n*/\n\n'
          s=prefix+s[root:]
          s=s.replace('@media(max-width:760px)','@media(max-width:700px)')
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run audit
      - name: Commit repair
        run: |
          git config user.name 'lc-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/css/lc.css
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No CSS changes required.'
          else
            git commit -m 'Normalize canonical CSS header and breakpoints'
            git push
          fi
