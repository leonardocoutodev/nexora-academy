name: One-shot CSS audit repair

on:
  push:
    paths:
      - '.github/workflows/repair-css-audit.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair canonical CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/assets/css/lc.css')
          s=p.read_text()
          stale='500;600;700;800&display=optional\");\n\n'
          if stale in s:
              s=s.replace(stale,'',1)
          bad='@media(max-width:760px)'
          if bad not in s:
              raise SystemExit('Expected 760px breakpoint not found')
          s=s.replace(bad,'@media(max-width:700px)',1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run audit
      - name: Commit repair
        run: |
          git config user.name 'lc-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets/css/lc.css
          git diff --cached --check
          git commit -m 'Fix canonical CSS audit regressions'
          git push
