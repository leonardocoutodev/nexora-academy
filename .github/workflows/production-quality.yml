name: Production Browser QA

on:
  workflow_run:
    workflows: ["Deploy Production"]
    types: [completed]

permissions:
  contents: read

jobs:
  production-smoke:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install production browser QA
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed build
        id: deployed
        run: |
          EXPECTED_BUILD="${{ github.event.workflow_run.head_sha }}"
          HEALTH="$(curl -fsS https://academy.learnandcreate.workers.dev/api/health)"
          DEPLOYED_BUILD="$(node -e 'const s=require("fs").readFileSync(0,"utf8");process.stdout.write(String(JSON.parse(s).build||""))' <<< "$HEALTH")"
          if [ "$DEPLOYED_BUILD" = "$EXPECTED_BUILD" ]; then
            echo "run_browser=true" >> "$GITHUB_OUTPUT"
            echo "Production is on expected build $EXPECTED_BUILD"
          else
            echo "run_browser=false" >> "$GITHUB_OUTPUT"
            echo "QA run superseded: expected $EXPECTED_BUILD but production is already on $DEPLOYED_BUILD"
          fi
      - name: Browser smoke against production
        if: steps.deployed.outputs.run_browser == 'true'
        env:
          LC_E2E_BASE_URL: https://academy.learnandcreate.workers.dev
        run: npx playwright test --grep @compat --project=chromium
      - name: Upload production QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-qa-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
