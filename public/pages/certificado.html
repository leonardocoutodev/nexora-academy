<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111F"><link rel="icon" type="image/svg+xml" href="../assets/brand/lc-mark.svg"><link rel="manifest" href="../manifest.webmanifest"><title>Certificado — LC</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../assets/css/academy-v3.css"></head><body><main class="main"><div class="main-inner" style="max-width:1100px;padding-top:30px"><div id="state" class="loading">Carregando certificado</div><section id="cert" class="v3-certificate hidden"><img src="../assets/brand/lc-mark.svg" alt="LC" style="width:92px;max-width:28%;margin:auto"><div style="font-size:22px;font-weight:800;letter-spacing:-.04em;margin-top:8px">LC</div><div class="eyebrow" style="margin-top:30px">CERTIFICADO DE CONCLUSÃO</div><h1>Certificamos que</h1><div class="name" id="student"></div><p>concluiu com êxito a formação</p><h2 id="course"></h2><p id="date"></p><p>Código de verificação: <b id="code"></b></p><div class="v3-toolbar" style="justify-content:center"><button class="v3-btn" onclick="window.print()">Imprimir / salvar PDF</button><a id="verify" class="v3-btn secondary" href="#">Verificação pública</a></div></section></div></main><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-lc.js"></script><script>
(async()=>{const code=new URLSearchParams(location.search).get('code'),st=qs('#state');if(!code){setState(st,'error','Código não informado.');return}try{const r=await LCSupabase.rpc('verify_certificate',{p_code:code});const v=Array.isArray(r)?r[0]:r;if(!v?.valid)throw new Error('Certificado não encontrado.');qs('#student').textContent=v.student_name;qs('#course').textContent=v.course_title;qs('#date').textContent='Emitido em '+new Date(v.issued_at).toLocaleDateString('pt-BR');qs('#code').textContent=v.verification_code;qs('#verify').href='verificar.html?code='+encodeURIComponent(v.verification_code);st.classList.add('hidden');qs('#cert').classList.remove('hidden')}catch(e){setState(st,'error',e.message)}})();
</script></body></html>
