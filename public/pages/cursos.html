<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cursos — Nexora</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand">NEXORA <span>ACADEMY</span></div><nav><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Visão geral</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Projetos</span></a><a data-nav="library" href="biblioteca.html"><span>▥</span><span>Biblioteca</span></a><a data-nav="certs" href="certificados.html"><span>▣</span><span>Certificados</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav><div class="side-footer">AI Builder<br>Aprenda construindo.</div></aside><main class="main"><header class="mobile-header"><div class="brand">NEXORA <span>ACADEMY</span></div><button class="btn-ghost" data-logout>Sair</button></header><div class="main-inner"><div class="topbar"><div><div class="eyebrow">FORMAÇÕES</div><h1>Meus cursos</h1><p class="muted">Acompanhe seu acesso e continue sua evolução.</p></div></div><div id="state" class="loading">Carregando cursos</div><div id="grid" class="grid-2 hidden"></div></div><nav class="bottom-nav"><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Início</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Projetos</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav></main></div><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script src="../assets/js/app-shell.js"></script><script>(async()=>{const ctx=await nexoraBoot("courses");if(!ctx)return;try{const[courses,enrolls]=await Promise.all([NexoraSupabase.courses(),NexoraSupabase.enrollments()]);const byId=new Map(enrolls.map(e=>[e.course_id,e]));const g=qs("#grid");g.innerHTML=courses.map(c=>{const e=byId.get(c.id);return `<article class="card course-card"><div class="course-meta">${e?'<span class="badge ok">Matriculado</span>':'<span class="badge locked">Sem acesso</span>'}</div><h2 class="course-title">${esc(c.title)}</h2><p class="muted">${esc(c.description||"")}</p><div class="course-actions"><span class="muted">Nota mínima: ${Number(c.minimum_score||70)}%</span>${e?`<a class="btn" href="curso.html?id=${encodeURIComponent(c.id)}">Abrir curso</a>`:`<a class="btn-secondary" href="checkout.html">Conhecer acesso</a>`}</div></article>`}).join("");qs("#state").classList.add("hidden");g.classList.remove("hidden")}catch(e){setState(qs("#state"),"error",e.message)}})();</script></body></html>
