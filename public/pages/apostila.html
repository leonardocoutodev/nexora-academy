<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apostila — Nexora Academy</title><link rel="stylesheet" href="../assets/css/styles.css"><style>body{background:#eef3f8;color:#102030;margin:0}.tools{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:10px;padding:10px;background:rgba(238,243,248,.96)}.tools button,.tools a{border:0;border-radius:10px;padding:11px 15px;font-weight:800;background:#155fff;color:#fff;text-decoration:none}.tools a{background:#dce8f6;color:#163653}.book{max-width:920px;margin:28px auto;background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.12);padding:54px}.cover{min-height:62vh;padding-bottom:34px;border-bottom:3px solid #1f6fff;display:flex;flex-direction:column}.cover img{width:190px}.cover h1{font-size:44px;margin:30px 0 10px}.chapter{padding:30px 0;border-bottom:1px solid #dbe4ee}.chapter h2{font-size:28px;color:#12345a}.chapter h3{font-size:20px;color:#194d82;margin-top:22px}.chapter p,.chapter li{font-size:16px;line-height:1.78;color:#24394f}.code{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;background:#0b1420;color:#e9f6ff;padding:16px;border-radius:10px;overflow:auto}.exercise,.resource-box{padding:16px;border-radius:12px;background:#eff6ff;border-left:4px solid #2e7cff;margin:16px 0}.pdf-view{position:fixed;inset:0;background:#202124}.pdf-view iframe{width:100%;height:100%;border:0}@media(max-width:700px){.book{margin:0;border-radius:0;padding:24px 20px}.cover h1{font-size:32px}.chapter h2{font-size:25px}.tools>*{flex:1;text-align:center}}@media print{.tools{display:none}.book{box-shadow:none;margin:0;max-width:none;padding:18mm}}</style></head><body><div class="tools" id="tools"><a href="../index.html" id="backLink">← Voltar</a><button id="pdfBtn">Baixar PDF</button></div><main id="book" class="book"><div class="loading">Carregando apostila</div></main><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script>
const params=new URLSearchParams(location.search),moduleId=params.get('module'),embed=params.get('embed')==='1';qs('#backLink').addEventListener('click',event=>{if(history.length>1){event.preventDefault();history.back()}});let DATA=null;function blockText(raw){if(typeof raw==='string')return raw;let s=(raw?.title||raw?.label||'')+'\n'+(raw?.body||'');if(Array.isArray(raw?.items))s+='\n'+raw.items.map(x=>'• '+x).join('\n');return s.trim()}function renderBlock(raw,i){if(typeof raw==='string')return '<h3>Parte '+(i+1)+'</h3><p>'+esc(raw)+'</p>';let h='<h3>'+esc(raw?.title||raw?.label||('Parte '+(i+1)))+'</h3>';if(raw?.body)h+=raw.language?'<div class="code">'+esc(raw.body)+'</div>':'<p>'+esc(raw.body)+'</p>';if(Array.isArray(raw?.items))h+='<ul>'+raw.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';return h}function safeName(s){return String(s||'apostila').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()}function makePdf(){if(!DATA||!window.jspdf)throw new Error('PDF ainda não está pronto.');const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),W=210,H=297,M=18,max=174;let y=22;const page=()=>{doc.addPage();y=22},need=n=>{if(y+n>H-18)page()},text=(t,size=10,bold=false)=>{doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size);const lines=doc.splitTextToSize(String(t||''),max);need(lines.length*(size*.42)+4);doc.text(lines,M,y);y+=lines.length*(size*.42)+4};doc.setTextColor(28,83,155);text('NEXORA ACADEMY',17,true);doc.setTextColor(20,35,55);text('APOSTILA DO MÓDULO '+DATA.m.position,10,true);text(DATA.m.title,22,true);text(DATA.c.title,12);y+=6;text('Material oficial de aprofundamento, exemplos, prática e revisão.',11);DATA.lessons.forEach((l,i)=>{need(30);doc.setTextColor(28,83,155);text('AULA '+(i+1),9,true);doc.setTextColor(20,35,55);text(l.title,16,true);text('Objetivo: '+(l.objective||'Aplicar a competência proposta.'),10);(Array.isArray(l.content)?l.content:[]).forEach(b=>{const t=blockText(b);if(t)text(t,10)});text('Prática de consolidação: altere entradas ou condições do exemplo, preveja o resultado e valide no laboratório da Nexora.',10,true)});if(DATA.resources.length){need(24);text('MATERIAIS COMPLEMENTARES',15,true);DATA.resources.forEach(r=>text(r.title+' - '+(r.summary||r.resource_type),10))}if(DATA.references.length){need(24);text('REFERÊNCIAS EDITORIAIS',15,true);DATA.references.forEach(r=>text(r.publisher+': '+r.title+(r.topic?' - '+r.topic:''),9))}const pages=doc.getNumberOfPages();for(let p=1;p<=pages;p++){doc.setPage(p);doc.setFontSize(8);doc.setTextColor(100);doc.text('Nexora Academy • '+DATA.m.title,M,289);doc.text(String(p)+'/'+pages,192,289,{align:'right'})}return doc}function showPdf(){const doc=makePdf(),url=doc.output('bloburl');document.body.innerHTML='<div class="pdf-view"><iframe title="PDF da apostila" src="'+url+'"></iframe></div>'}function downloadPdf(){const doc=makePdf();doc.save('nexora-apostila-'+safeName(DATA.m.title)+'.pdf')}
(async()=>{const book=qs('#book');if(!moduleId){book.innerHTML='<div class="error">Módulo não informado.</div>';return}try{const m=(await NexoraSupabase.rest('modules?id=eq.'+encodeURIComponent(moduleId)+'&select=id,title,course_id,position'))[0],c=(await NexoraSupabase.rest('courses?id=eq.'+encodeURIComponent(m.course_id)+'&select=id,title'))[0],[lessons,references,resources]=await Promise.all([NexoraSupabase.rest('lessons?module_id=eq.'+encodeURIComponent(moduleId)+'&status=eq.published&select=id,title,objective,estimated_minutes,content,position&order=position.asc'),NexoraSupabase.rest('curriculum_references?module_id=eq.'+encodeURIComponent(moduleId)+'&status=eq.active&select=publisher,title,url,topic&order=publisher.asc').catch(()=>[]),NexoraSupabase.rest('learning_resources?module_id=eq.'+encodeURIComponent(moduleId)+'&status=eq.published&select=title,resource_type,summary,content,position&order=position.asc').catch(()=>[])]);DATA={m,c,lessons,references,resources};let html='<section class="cover"><img src="../assets/brand/nexora-logo.svg" alt="Nexora Academy"><div style="margin-top:auto"><b>APOSTILA DIGITAL • MÓDULO '+m.position+'</b><h1>'+esc(m.title)+'</h1><p>'+esc(c.title)+'</p><p>Conteúdo completo para aprofundamento, revisão e prática. O PDF oficial contém esta mesma base editorial.</p></div></section><section class="chapter"><h2>Sumário</h2><ol>'+lessons.map(l=>'<li>'+esc(l.title)+'</li>').join('')+'</ol></section>';lessons.forEach((l,i)=>{html+='<section class="chapter"><b>AULA '+(i+1)+'</b><h2>'+esc(l.title)+'</h2><p><b>Objetivo:</b> '+esc(l.objective||'Aplicar a competência proposta.')+'</p>'+(Array.isArray(l.content)?l.content.map(renderBlock).join(''):'')+'<div class="exercise"><b>Prática de consolidação</b><p>Altere entradas ou condições do exemplo, preveja o resultado e valide no laboratório correspondente.</p></div></section>'});if(resources.length)html+='<section class="chapter"><h2>Materiais complementares</h2>'+resources.map(r=>'<div class="resource-box"><b>'+esc(r.title)+'</b><p>'+esc(r.summary||r.resource_type)+'</p></div>').join('')+'</section>';book.innerHTML=html;document.title='Apostila — '+m.title+' — Nexora Academy';qs('#pdfBtn').onclick=downloadPdf;if(embed)setTimeout(showPdf,120)}catch(e){book.innerHTML='<div class="error">Não foi possível montar a apostila: '+esc(e.message)+'</div>'}})();</script></body></html>
