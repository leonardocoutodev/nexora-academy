<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apostila — Nexora Academy</title><link rel="stylesheet" href="../assets/css/styles.css"><style>body{background:#eef3f8;color:#102030}.book{max-width:900px;margin:30px auto;background:white;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.12);padding:54px}.cover{padding-bottom:34px;border-bottom:3px solid #1f6fff}.cover img{width:190px}.cover h1{font-size:44px;margin:30px 0 10px;color:#102030}.cover p{color:#52677f;font-size:18px}.chapter{padding:30px 0;border-bottom:1px solid #dbe4ee}.chapter h2{font-size:28px;color:#12345a}.chapter h3{font-size:20px;color:#194d82;margin-top:22px}.chapter p,.chapter li{font-size:16px;line-height:1.75;color:#24394f}.tools{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:10px;padding:10px;background:rgba(238,243,248,.95);backdrop-filter:blur(8px)}.tools button,.tools a{border:0;border-radius:10px;padding:10px 14px;font-weight:800;background:#155fff;color:white;text-decoration:none}.tools a{background:#dce8f6;color:#163653}.exercise{padding:18px;border-radius:12px;background:#eff6ff;border-left:4px solid #2e7cff;margin:18px 0}.code{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;background:#0b1420;color:#e9f6ff;padding:16px;border-radius:10px;overflow:auto}@media print{body{background:white}.tools{display:none}.book{box-shadow:none;margin:0;max-width:none;padding:20mm}.chapter{break-inside:avoid}.cover{min-height:230mm;display:flex;flex-direction:column;justify-content:center}.cover img{width:220px}}@media(max-width:700px){.book{margin:0;border-radius:0;padding:26px}.cover h1{font-size:34px}}</style></head><body><div class="tools"><a href="javascript:history.back()">← Voltar à aula</a><button onclick="window.print()">Imprimir / salvar PDF</button></div><main id="book" class="book"><div class="loading">Carregando apostila</div></main><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script>
function renderBody(text){if(/(const |let |function |select |insert |create table|fetch\(|npm |npx |curl |git |=>|console\.)/i.test(text))return `<div class="code">${esc(text)}</div>`;return `<p>${esc(text)}</p>`}
(async()=>{const moduleId=new URLSearchParams(location.search).get('module');const book=qs('#book');if(!moduleId){book.innerHTML='<div class="error">Módulo não informado.</div>';return}try{const m=(await NexoraSupabase.rest(`modules?id=eq.${encodeURIComponent(moduleId)}&select=id,title,course_id,position`))[0];const c=(await NexoraSupabase.rest(`courses?id=eq.${encodeURIComponent(m.course_id)}&select=id,title,description`))[0];const lessons=await NexoraSupabase.rest(`lessons?module_id=eq.${encodeURIComponent(moduleId)}&status=eq.published&select=id,title,objective,estimated_minutes,content,position&order=position.asc`);let html=`<section class="cover"><img src="../assets/brand/nexora-logo.svg" alt="Nexora Academy"><div style="margin-top:auto"><div style="font-weight:900;color:#2879ff;letter-spacing:.13em">APOSTILA DIGITAL • MÓDULO ${m.position}</div><h1>${esc(m.title)}</h1><p>${esc(c.title)}</p><p>Material de estudo e prática • Nexora Academy • projeto educacional gratuito</p></div></section><section class="chapter"><h2>Como usar esta apostila</h2><p>Não leia passivamente. Em cada capítulo, execute os exemplos, faça a prática e registre os resultados. A versão online da aula salva suas atividades e seu progresso.</p><div class="exercise"><b>Regra de estudo</b><p>Entenda → reproduza → modifique → teste → explique com suas palavras.</p></div></section>`;lessons.forEach((l,li)=>{html+=`<section class="chapter"><div style="color:#2879ff;font-weight:900">AULA ${li+1}</div><h2>${esc(l.title)}</h2><p><b>Objetivo:</b> ${esc(l.objective||'Aplicar a competência proposta.')}</p><p><b>Tempo sugerido:</b> ${l.estimated_minutes||45} minutos</p>`;const blocks=Array.isArray(l.content)?l.content:[];blocks.forEach((raw,i)=>{const text=typeof raw==='string'?raw:(raw?.text||raw?.content||JSON.stringify(raw));const parts=text.split(' — '),title=parts.length>1?parts.shift():`Parte ${i+1}`,body=parts.length?parts.join(' — '):text;html+=`<h3>${esc(title)}</h3>${renderBody(body)}`});html+=`<div class="exercise"><b>Prática de retenção</b><p>Explique o procedimento desta aula sem consultar o texto. Depois execute novamente em um exemplo diferente e compare o resultado.</p></div></section>`});html+=`<section class="chapter"><h2>Checklist de domínio do módulo</h2><ul><li>Consigo explicar o conceito com minhas palavras.</li><li>Consigo executar o procedimento sem copiar passo a passo.</li><li>Consigo reconhecer um erro comum e corrigi-lo.</li><li>Consigo validar se meu resultado está correto.</li><li>Consigo aplicar a competência em um caso novo.</li></ul><p>Quando todos os itens forem verdadeiros, volte à plataforma, faça o quiz do módulo e avance para o projeto aplicado.</p></section>`;book.innerHTML=html;document.title=`Apostila — ${m.title} — Nexora Academy`}catch(e){book.innerHTML=`<div class="error">Não foi possível montar a apostila: ${esc(e.message)}</div>`}})();
</script></body></html>
