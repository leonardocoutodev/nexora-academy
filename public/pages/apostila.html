<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apostila — Nexora Academy</title><link rel="stylesheet" href="../assets/css/styles.css"><style>body{background:#eef3f8;color:#102030}.book{max-width:920px;margin:30px auto;background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.12);padding:54px}.cover{min-height:72vh;padding-bottom:34px;border-bottom:3px solid #1f6fff;display:flex;flex-direction:column}.cover img{width:190px}.cover h1{font-size:44px;margin:30px 0 10px}.chapter{padding:30px 0;border-bottom:1px solid #dbe4ee}.chapter h2{font-size:28px;color:#12345a}.chapter h3{font-size:20px;color:#194d82;margin-top:22px}.chapter p,.chapter li{font-size:16px;line-height:1.78;color:#24394f}.tools{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:10px;padding:10px;background:rgba(238,243,248,.95);backdrop-filter:blur(8px)}.tools button,.tools a{border:0;border-radius:10px;padding:10px 14px;font-weight:800;background:#155fff;color:#fff;text-decoration:none}.tools a{background:#dce8f6;color:#163653}.exercise{padding:18px;border-radius:12px;background:#eff6ff;border-left:4px solid #2e7cff;margin:18px 0}.code{white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;background:#0b1420;color:#e9f6ff;padding:16px;border-radius:10px;overflow:auto}.toc a{display:block;padding:7px 0;color:#155fff}.resource-box{padding:15px;border:1px solid #d8e4f0;border-radius:12px;margin:10px 0;background:#f8fbff}@media print{body{background:#fff}.tools{display:none}.book{box-shadow:none;margin:0;max-width:none;padding:20mm}.chapter{break-inside:avoid}.cover{min-height:230mm;justify-content:center}}@media(max-width:700px){.tools{justify-content:stretch}.tools>*{flex:1;text-align:center}.book{margin:0;border-radius:0;padding:24px 20px}.cover{min-height:60vh}.cover h1{font-size:32px}.chapter h2{font-size:25px}.chapter p,.chapter li{font-size:16px}.code{font-size:13px}}</style></head><body><div class="tools"><a href="javascript:history.back()">← Voltar</a><button onclick="window.print()">Salvar em PDF</button></div><main id="book" class="book"><div class="loading">Carregando apostila</div></main><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script>function renderBlock(raw,i){if(typeof raw==='string')return '<h3>Parte '+(i+1)+'</h3><p>'+esc(raw)+'</p>';const title=raw?.title||raw?.label||('Parte '+(i+1));let html='<h3>'+esc(title)+'</h3>';if(raw?.body)html+=raw.language?'<div class="code">'+esc(raw.body)+'</div>':'<p>'+esc(raw.body)+'</p>';if(Array.isArray(raw?.items)&&raw.items.length)html+='<ul>'+raw.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';return html}(async()=>{const moduleId=new URLSearchParams(location.search).get('module'),book=qs('#book');if(!moduleId){book.innerHTML='<div class="error">Módulo não informado.</div>';return}try{const m=(await NexoraSupabase.rest('modules?id=eq.'+encodeURIComponent(moduleId)+'&select=id,title,course_id,position'))[0],c=(await NexoraSupabase.rest('courses?id=eq.'+encodeURIComponent(m.course_id)+'&select=id,title'))[0],[lessons,references,resources]=await Promise.all([NexoraSupabase.rest('lessons?module_id=eq.'+encodeURIComponent(moduleId)+'&status=eq.published&select=id,title,objective,estimated_minutes,content,position,lab_type&order=position.asc'),NexoraSupabase.rest('curriculum_references?module_id=eq.'+encodeURIComponent(moduleId)+'&status=eq.active&select=publisher,title,url,topic&order=publisher.asc').catch(()=>[]),NexoraSupabase.rest('learning_resources?module_id=eq.'+encodeURIComponent(moduleId)+'&status=eq.published&select=title,resource_type,summary,content,position&order=position.asc').catch(()=>[])]);let html='<section class="cover"><img src="../assets/brand/nexora-logo.svg" alt="Nexora Academy"><div style="margin-top:auto"><div style="font-weight:900;color:#2879ff;letter-spacing:.13em">APOSTILA DIGITAL • MÓDULO '+m.position+'</div><h1>'+esc(m.title)+'</h1><p>'+esc(c.title)+'</p><p>Conteúdo de aprofundamento, revisão e prática. Esta versão responsiva pode ser salva em PDF pelo botão acima.</p></div></section><section class="chapter"><h2>Como estudar este módulo</h2><p>A apostila complementa as aulas interativas. Use-a para aprofundar conceitos, revisar exemplos, comparar soluções e preparar-se para os laboratórios e checkpoints.</p><div class="exercise"><b>Estratégia recomendada</b><p>Compreenda o conceito → acompanhe o exemplo → explique a lógica → execute a prática → teste casos diferentes → revise o erro, se houver.</p></div></section><section class="chapter toc"><h2>Sumário</h2>'+lessons.map((l,i)=>'<a href="#aula-'+(i+1)+'">'+(i+1)+'. '+esc(l.title)+'</a>').join('')+'</section>';lessons.forEach((l,li)=>{html+='<section class="chapter" id="aula-'+(li+1)+'"><div style="color:#2879ff;font-weight:900">AULA '+(li+1)+'</div><h2>'+esc(l.title)+'</h2><p><b>Objetivo:</b> '+esc(l.objective||'Aplicar a competência proposta.')+'</p><p><b>Tempo estimado:</b> '+(l.estimated_minutes||30)+' minutos</p>';const blocks=Array.isArray(l.content)?l.content:[];blocks.forEach((raw,i)=>html+=renderBlock(raw,i));html+='<div class="exercise"><b>Prática de consolidação</b><p>Antes de avançar, refaça mentalmente o exemplo com uma entrada diferente, preveja o resultado e depois valide no laboratório da Nexora. Registre apenas o artefato funcional quando a atividade exigir entrega; não há redação obrigatória.</p></div></section>'});if(resources.length)html+='<section class="chapter"><h2>Kit de aprendizagem do módulo</h2>'+resources.map(r=>'<div class="resource-box"><b>'+esc(r.title)+'</b><p>'+esc(r.summary||r.resource_type)+'</p></div>').join('')+'</section>';html+='<section class="chapter"><h2>Revisão final</h2><ul><li>Consigo explicar os conceitos sem depender de memorização mecânica.</li><li>Consigo acompanhar e justificar um exemplo resolvido.</li><li>Consigo prever o resultado antes de executar.</li><li>Consigo identificar erros e testar casos de limite.</li><li>Concluí as práticas e o checkpoint do módulo.</li></ul></section>'+(references.length?'<section class="chapter"><h2>Referências editoriais</h2><p>Fontes técnicas utilizadas na revisão acadêmica. O conteúdo essencial já está na Nexora.</p><ul>'+references.map(r=>'<li><b>'+esc(r.publisher)+':</b> <a href="'+esc(r.url)+'">'+esc(r.title)+'</a> — '+esc(r.topic||'')+'</li>').join('')+'</ul></section>':'');book.innerHTML=html;document.title='Apostila — '+m.title+' — Nexora Academy'}catch(e){book.innerHTML='<div class="error">Não foi possível montar a apostila: '+esc(e.message)+'</div>'}})();</script></body></html>
