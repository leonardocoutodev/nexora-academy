<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111F"><link rel="icon" type="image/svg+xml" href="../assets/brand/lc-mark.svg"><link rel="manifest" href="../manifest.webmanifest"><title>Entrar — LC</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../assets/css/academy-v3.css"></head><body><div class="login-page"><section class="login-hero"><a class="brand" href="../index.html"><img src="../assets/brand/lc-mark.svg" alt="LC"><span class="lc-brand-name">LC</span></a><div class="eyebrow" style="margin-top:36px">CONTINUE SUA TRILHA</div><h1 class="hero-title">Missões curtas. <span>Prática real.</span></h1><p class="muted" style="font-size:18px;max-width:680px">Volte para seus laboratórios, checkpoints, XP, Boss Fights e certificados.</p><div class="v3-hud"><span class="v3-pill">Prompts</span><span class="v3-pill">Planilhas</span><span class="v3-pill">Código</span><span class="v3-pill">Quizzes</span></div></section><section class="login-panel"><div class="login-card"><div class="eyebrow">BEM-VINDO DE VOLTA</div><h2 style="font-size:30px;margin:8px 0">Entrar</h2><p class="muted">Acesse sua conta LC e continue de onde parou.</p><form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" required><label for="password">Senha</label><div class="nx-password-wrap"><input id="password" type="password" autocomplete="current-password" minlength="8" required><button class="nx-password-toggle" type="button" data-password-toggle aria-pressed="false">Mostrar</button></div><button id="submit" class="v3-btn" style="width:100%;margin-top:16px">Entrar →</button><div id="msg" style="margin-top:12px"></div></form><p class="muted" style="text-align:center;margin-top:16px">Ainda não tem conta? <a href="cadastro.html" style="color:#62b8ff"><b>Criar conta gratuita</b></a></p></div></section></div><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script>(async()=>{if(await NexoraSupabase.user())location.replace('dashboard.html')})();const loginFormEl=qs('#loginForm'),emailEl=qs('#email'),passwordEl=qs('#password'),submitEl=qs('#submit'),msgEl=qs('#msg'),passwordToggleEl=qs('[data-password-toggle]');passwordToggleEl.onclick=()=>{const show=passwordEl.type==='password';passwordEl.type=show?'text':'password';passwordToggleEl.textContent=show?'Ocultar':'Mostrar';passwordToggleEl.setAttribute('aria-pressed',String(show))};loginFormEl.onsubmit=async e=>{e.preventDefault();submitEl.disabled=true;setState(msgEl,'loading','Entrando...');try{await NexoraSupabase.signIn({email:emailEl.value,password:passwordEl.value});if(!(await NexoraSupabase.user()))throw new Error('Não foi possível confirmar a sessão.');location.replace('dashboard.html')}catch(err){setState(msgEl,'error',err.message);submitEl.disabled=false}};</script></body></html>
