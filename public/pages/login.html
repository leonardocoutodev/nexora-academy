<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Nexora Academy</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><div class="login-page"><section class="login-hero"><div class="brand">NEXORA <span>ACADEMY</span></div><div class="eyebrow" style="margin-top:36px">AI BUILDER</div><h1 class="hero-title">Aprenda IA e desenvolvimento <span>construindo.</span></h1><p class="muted" style="font-size:18px;max-width:680px">Uma experiência EAD prática, direta e orientada a projetos reais.</p></section><section class="login-panel"><div class="login-card"><h2>Entrar</h2><p class="muted">Acesse sua conta Nexora.</p><form id="loginForm"><label>E-mail</label><input id="email" type="email" autocomplete="email" required><label>Senha</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button id="submit" class="btn" style="width:100%;margin-top:16px">Entrar</button><div id="msg" style="margin-top:12px"></div></form><p class="muted" style="text-align:center;margin-top:16px">Não tem conta? <a href="cadastro.html"><b>Criar conta</b></a></p></div></section></div><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script>(async()=>{if(await NexoraSupabase.user())location.replace("dashboard.html")})();loginForm.onsubmit=async e=>{e.preventDefault();submit.disabled=true;setState(msg,"loading","Entrando");try{await NexoraSupabase.signIn({email:email.value,password:password.value});if(!(await NexoraSupabase.user()))throw new Error("Não foi possível confirmar a sessão.");location.replace("dashboard.html")}catch(err){setState(msg,"error",err.message);submit.disabled=false}};</script></body></html>
