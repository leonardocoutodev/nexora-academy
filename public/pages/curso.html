<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curso — Nexora</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand">NEXORA <span>ACADEMY</span></div><nav><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Visão geral</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Projetos</span></a><a data-nav="library" href="biblioteca.html"><span>▥</span><span>Biblioteca</span></a><a data-nav="certs" href="certificados.html"><span>▣</span><span>Certificados</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav><div class="side-footer">AI Builder<br>Aprenda construindo.</div></aside><main class="main"><header class="mobile-header"><div class="brand">NEXORA <span>ACADEMY</span></div><button class="btn-ghost" data-logout>Sair</button></header><div class="main-inner"><div id="state" class="loading">Carregando curso</div><section id="content" class="hidden"><div class="topbar"><div><div class="eyebrow">CURSO</div><h1 id="courseTitle"></h1><p class="muted" id="courseDesc"></p></div></div><div id="modules"></div></section></div><nav class="bottom-nav"><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Início</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Projetos</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav></main></div><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script src="../assets/js/app-shell.js"></script><script>(async()=>{const ctx=await nexoraBoot("courses");if(!ctx)return;const id=new URLSearchParams(location.search).get("id");if(!id){setState(qs("#state"),"error","Curso não informado.");return}try{const[courseRows,enrollRows,mods]=await Promise.all([NexoraSupabase.rest(`courses?id=eq.${encodeURIComponent(id)}&select=*`),NexoraSupabase.rest(`enrollments?course_id=eq.${encodeURIComponent(id)}&select=*`),NexoraSupabase.rest(`modules?course_id=eq.${encodeURIComponent(id)}&select=id,title,position&order=position.asc`)]);if(!courseRows[0])throw new Error("Curso não encontrado.");if(!enrollRows[0])throw new Error("Você ainda não possui matrícula neste curso.");qs("#courseTitle").textContent=courseRows[0].title;qs("#courseDesc").textContent=courseRows[0].description||"";const modEl=qs("#modules");let html="";for(const m of mods){const lessons=await NexoraSupabase.rest(`lessons?module_id=eq.${encodeURIComponent(m.id)}&select=id,title,position&order=position.asc`);html+=`<section class="card card-pad" style="margin-bottom:16px"><div class="eyebrow">MÓDULO ${m.position}</div><h2>${esc(m.title)}</h2>${lessons.length?lessons.map((l,i)=>`<a class="lesson-item" style="display:block" href="aula.html?id=${encodeURIComponent(l.id)}">${i+1}. ${esc(l.title)}</a>`).join(""):`<div class="empty">Conteúdo em preparação.</div>`}</section>`}modEl.innerHTML=html;qs("#state").classList.add("hidden");qs("#content").classList.remove("hidden")}catch(e){setState(qs("#state"),"error",e.message)}})();</script></body></html>
