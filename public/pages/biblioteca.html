<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca — Nexora</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand">NEXORA <span>ACADEMY</span></div><nav><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Visão geral</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Projetos</span></a><a data-nav="library" href="biblioteca.html"><span>▥</span><span>Biblioteca</span></a><a data-nav="certs" href="certificados.html"><span>▣</span><span>Certificados</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav><div class="side-footer">AI Builder<br>Aprenda construindo.</div></aside><main class="main"><header class="mobile-header"><div class="brand">NEXORA <span>ACADEMY</span></div><button class="btn-ghost" data-logout>Sair</button></header><div class="main-inner"><div class="topbar"><div><div class="eyebrow">BIBLIOTECA</div><h1>Materiais</h1><p class="muted">Materiais liberados conforme sua matrícula.</p></div></div><div class="card card-pad"><input id="search" placeholder="Buscar materiais..."></div><div id="state" class="loading" style="margin-top:16px">Carregando materiais</div><div id="materials" class="grid-2 hidden" style="margin-top:16px"></div></div><nav class="bottom-nav"><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Início</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Projetos</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav></main></div><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script src="../assets/js/app-shell.js"></script><script>(async()=>{const ctx=await nexoraBoot("library");if(!ctx)return;try{const rows=await NexoraSupabase.rest("lesson_assets?select=id,filename,mime_type,lesson_id");const render=(q="")=>{const f=rows.filter(x=>x.filename.toLowerCase().includes(q.toLowerCase()));qs("#materials").innerHTML=f.length?f.map(a=>`<article class="card card-pad"><div class="eyebrow">MATERIAL</div><h3>${esc(a.filename)}</h3><p class="muted">${esc(a.mime_type||"arquivo")}</p><span class="badge locked">Acesso controlado</span></article>`).join(""):`<div class="empty">Nenhum material encontrado.</div>`};render();qs("#search").oninput=e=>render(e.target.value);qs("#state").classList.add("hidden");qs("#materials").classList.remove("hidden")}catch(e){setState(qs("#state"),"error",e.message)}})();</script></body></html>
