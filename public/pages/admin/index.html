<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Nexora</title><link rel="stylesheet" href="../../assets/css/styles.css"></head><body><main class="container page"><div class="topbar"><div><div class="eyebrow">ADMIN</div><h1>Painel Nexora</h1><p class="muted">Visão operacional da plataforma.</p></div></div><div id="state" class="loading">Carregando indicadores</div><div id="content" class="hidden"><div class="admin-grid"><div class="card card-pad stat"><span>Alunos</span><strong id="students">0</strong></div><div class="card card-pad stat"><span>Matrículas ativas</span><strong id="enrolls">0</strong></div><div class="card card-pad stat"><span>Cursos</span><strong id="courses">0</strong></div><div class="card card-pad stat"><span>Pedidos</span><strong id="orders">0</strong></div></div></div></main><script src="../../assets/js/ui.js"></script><script src="../../assets/js/supabase-nexora.js"></script><script>(async()=>{const u=await NexoraSupabase.user();if(!u){location.replace("../login.html");return};const p=await NexoraSupabase.profile();if(p?.role!=="admin"){setState(qs("#state"),"error","Acesso administrativo não autorizado.");return};try{const[a,e,c,o]=await Promise.all([NexoraSupabase.rest("profiles?select=id"),NexoraSupabase.rest("enrollments?status=eq.active&select=id"),NexoraSupabase.rest("courses?select=id"),NexoraSupabase.rest("orders?select=id")]);students.textContent=a.length;enrolls.textContent=e.length;courses.textContent=c.length;orders.textContent=o.length;qs("#state").classList.add("hidden");qs("#content").classList.remove("hidden")}catch(err){setState(qs("#state"),"error",err.message)}})();</script></body></html>
