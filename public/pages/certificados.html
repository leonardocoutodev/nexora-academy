<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificados — Nexora</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand">NEXORA <span>ACADEMY</span></div><nav><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Visão geral</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Projetos</span></a><a data-nav="library" href="biblioteca.html"><span>▥</span><span>Biblioteca</span></a><a data-nav="certs" href="certificados.html"><span>▣</span><span>Certificados</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav><div class="side-footer">AI Builder<br>Aprenda construindo.</div></aside><main class="main"><header class="mobile-header"><div class="brand">NEXORA <span>ACADEMY</span></div><button class="btn-ghost" data-logout>Sair</button></header><div class="main-inner"><div class="topbar"><div><div class="eyebrow">CERTIFICADOS</div><h1>Meus certificados</h1><p class="muted">Documentos emitidos após conclusão elegível.</p></div></div><div id="state" class="loading">Carregando certificados</div><div id="grid" class="grid-2 hidden"></div></div><nav class="bottom-nav"><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Início</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Projetos</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav></main></div><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script src="../assets/js/app-shell.js"></script><script>(async()=>{const ctx=await nexoraBoot("certs");if(!ctx)return;try{const rows=await NexoraSupabase.rest("certificates?select=id,course_id,verification_code,issued_at");const g=qs("#grid");g.innerHTML=rows.length?rows.map(c=>`<article class="card card-pad"><div class="eyebrow">CERTIFICADO</div><h2>Certificado de conclusão</h2><p class="muted">Emitido em ${new Date(c.issued_at).toLocaleDateString("pt-BR")}</p><div class="badge ok">${esc(c.verification_code)}</div></article>`).join(""):`<div class="empty"><h3>Nenhum certificado ainda</h3><p>Conclua uma formação para receber seu primeiro certificado.</p><a class="btn" href="cursos.html">Ver meus cursos</a></div>`;qs("#state").classList.add("hidden");g.classList.remove("hidden")}catch(e){setState(qs("#state"),"error",e.message)}})();</script></body></html>
