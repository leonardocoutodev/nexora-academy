<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aula — Nexora</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand">NEXORA <span>ACADEMY</span></div><nav><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Visão geral</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Projetos</span></a><a data-nav="library" href="biblioteca.html"><span>▥</span><span>Biblioteca</span></a><a data-nav="certs" href="certificados.html"><span>▣</span><span>Certificados</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav><div class="side-footer">AI Builder<br>Aprenda construindo.</div></aside><main class="main"><header class="mobile-header"><div class="brand">NEXORA <span>ACADEMY</span></div><button class="btn-ghost" data-logout>Sair</button></header><div class="main-inner"><div id="state" class="loading">Carregando aula</div><section id="content" class="hidden lesson-layout"><article class="card lesson-content"><div class="eyebrow" id="lessonMeta"></div><h1 id="lessonTitle"></h1><div id="lessonBody"></div><div class="lesson-nav"><a class="btn-secondary" href="cursos.html">← Voltar aos cursos</a><button class="btn" id="completeBtn">Concluir aula</button></div></article><aside class="card lesson-side"><div class="eyebrow">NESTA AULA</div><p class="muted">Estude o conteúdo, pratique e conclua para registrar seu progresso.</p><div class="progress"><span id="lessonProgress" style="--progress:0%"></span></div></aside></section></div><nav class="bottom-nav"><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Início</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Projetos</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav></main></div><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script src="../assets/js/app-shell.js"></script><script>(async()=>{const ctx=await nexoraBoot("courses");if(!ctx)return;const id=new URLSearchParams(location.search).get("id");if(!id){setState(qs("#state"),"error","Aula não informada.");return}try{const rows=await NexoraSupabase.rest(`lessons?id=eq.${encodeURIComponent(id)}&select=id,title,objective,content,module_id,status`);const l=rows[0];if(!l)throw new Error("Aula não encontrada.");qs("#lessonTitle").textContent=l.title;qs("#lessonMeta").textContent="AULA";const blocks=Array.isArray(l.content)?l.content:[];qs("#lessonBody").innerHTML=`${l.objective?`<section><h2>Objetivo</h2><p>${esc(l.objective)}</p></section>`:""}${blocks.map(b=>typeof b==="string"?`<p>${esc(b)}</p>`:`<pre>${esc(JSON.stringify(b,null,2))}</pre>`).join("")}<section><h2>Pratique</h2><p class="muted">Aplique o conceito desta aula em uma situação real antes de avançar.</p></section>`;const current=await NexoraSupabase.rest(`lesson_progress?lesson_id=eq.${encodeURIComponent(id)}&select=progress`);const pct=Number(current[0]?.progress||0);qs("#lessonProgress").style.setProperty("--progress",pct+"%");if(pct>=100){qs("#completeBtn").textContent="Concluída";qs("#completeBtn").disabled=true}qs("#completeBtn").onclick=async()=>{const u=await NexoraSupabase.user();const payload={user_id:u.id,lesson_id:id,progress:100,completed_at:new Date().toISOString(),updated_at:new Date().toISOString()};await NexoraSupabase.rest("lesson_progress?on_conflict=user_id,lesson_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},body:JSON.stringify(payload)});qs("#lessonProgress").style.setProperty("--progress","100%");qs("#completeBtn").textContent="Concluída";qs("#completeBtn").disabled=true};qs("#state").classList.add("hidden");qs("#content").classList.remove("hidden")}catch(e){setState(qs("#state"),"error",e.message)}})();</script></body></html>
