<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missão — Nexora Academy</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../assets/css/academy-v3.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><img src="../assets/brand/nexora-logo.svg" alt="Nexora Academy"></div><nav><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Visão geral</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Boss Fights</span></a><a data-nav="library" href="biblioteca.html"><span>▥</span><span>Biblioteca</span></a><a data-nav="certs" href="certificados.html"><span>▣</span><span>Certificados</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav><div class="side-footer"></div></aside><main class="main"><header class="mobile-header"><div class="brand"><img src="../assets/brand/nexora-logo.svg" alt="Nexora Academy"></div><button class="btn-ghost" data-logout>Sair</button></header><div class="main-inner"><div id="state" class="loading">Preparando missão</div><div id="content" class="v3-lesson-shell hidden"><section class="v3-lesson-main"><div class="v3-mission-head"><div class="eyebrow" id="meta">MISSÃO</div><h1 id="title">Carregando...</h1><p class="muted" id="objective"></p><div class="v3-mission-meta"><span class="v3-pill" id="time">0 min</span><span class="v3-pill xp" id="xp">+0 XP</span><span class="v3-pill" id="difficulty">Nível 1</span><span class="v3-pill" id="statusBadge">Em andamento</span></div><div id="stepper" class="v3-stepper"></div></div><div id="stages" class="v3-stack" style="margin-top:14px"></div><div id="labHost"></div><section class="card card-pad" id="materials" style="margin-top:14px"><div class="v3-section-head" style="margin:0 0 12px"><div><div class="eyebrow">MATERIAIS</div><h2>Use sem sair da aula</h2></div><a class="btn-secondary" href="biblioteca.html">Biblioteca</a></div><div id="resourceList" class="v3-material-grid"></div></section><div class="lesson-actions" style="margin-top:14px"><a id="prevBtn" class="btn-secondary" href="cursos.html">← Voltar</a><button id="completeBtn" class="v3-btn" type="button" disabled>Concluir missão e ganhar XP →</button></div><div id="completeMsg" class="v3-feedback" style="display:none"></div></section><aside class="v3-lesson-side"><section class="card card-pad"><div class="eyebrow">MÓDULO</div><h3 id="moduleTitle" style="margin:6px 0"></h3><div class="v3-progress"><span id="moduleBar" style="width:0%"></span></div><small class="muted" id="moduleProgress">0/0 missões</small></section><section class="card card-pad"><div class="eyebrow">TRILHA</div><div id="lessonList" class="lesson-list"></div></section><section class="card card-pad"><div class="eyebrow">CHECKPOINT</div><div id="quickLinks" class="quick-links" style="margin-top:9px"></div></section></aside></div></div><nav class="bottom-nav"><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Início</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Boss</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav></main></div><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script src="../assets/js/app-shell.js"></script><script src="../assets/js/learning-labs.js"></script><script>
(async()=>{
 const ctx=await nexoraBoot('courses');if(!ctx)return;
 const id=new URLSearchParams(location.search).get('id'),state=qs('#state');if(!id){setState(state,'error','Missão não informada.');return}
 try{
  const lesson=(await NexoraSupabase.rest('lessons?id=eq.'+encodeURIComponent(id)+'&status=eq.published&select=id,module_id,title,objective,estimated_minutes,content,position,lab_type,lab_config,xp_reward,difficulty'))[0];
  if(!lesson)throw new Error('Missão não encontrada.');
  const module=(await NexoraSupabase.rest('modules?id=eq.'+encodeURIComponent(lesson.module_id)+'&select=id,course_id,title,position'))[0];
  const course=(await NexoraSupabase.rest('courses?id=eq.'+encodeURIComponent(module.course_id)+'&select=id,title'))[0];
  const [lessons,progress,resources,assess]=await Promise.all([
    NexoraSupabase.rest('lessons?module_id=eq.'+encodeURIComponent(module.id)+'&status=eq.published&select=id,title,estimated_minutes,position,xp_reward,lab_type&order=position.asc'),
    NexoraSupabase.progress(),
    NexoraSupabase.rest('learning_resources?module_id=eq.'+encodeURIComponent(module.id)+'&status=eq.published&select=id,title,resource_type,summary,content,position&order=position.asc').catch(()=>[]),
    NexoraSupabase.rest('assessments?module_id=eq.'+encodeURIComponent(module.id)+'&status=eq.published&select=id,title').catch(()=>[])
  ]);
  const pmap=new Map(progress.map(p=>[p.lesson_id,Number(p.progress||0)]));
  const idx=lessons.findIndex(x=>x.id===id),done=lessons.filter(x=>(pmap.get(x.id)||0)>=100).length,pct=lessons.length?Math.round(done/lessons.length*100):0;
  const currentDone=(pmap.get(id)||0)>=100;
  qs('#meta').textContent=(lesson.lab_type==='boss'?'BOSS FIGHT':'MISSÃO')+' '+(idx+1)+' DE '+lessons.length+' • '+course.title;
  qs('#title').textContent=lesson.title;qs('#objective').textContent=lesson.objective||'Aprenda, execute e valide uma competência objetiva.';
  qs('#time').textContent=(lesson.estimated_minutes||20)+' min';qs('#xp').textContent='+'+(lesson.xp_reward||100)+' XP';qs('#difficulty').textContent='Nível '+(lesson.difficulty||1);qs('#statusBadge').textContent=currentDone?'✓ Concluída':'Em andamento';
  qs('#moduleTitle').textContent=module.title;qs('#moduleBar').style.width=pct+'%';qs('#moduleProgress').textContent=done+'/'+lessons.length+' missões • '+pct+'%';
  qs('#lessonList').innerHTML=lessons.map((x,i)=>'<a class="lesson-row '+(x.id===id?'active ':'')+((pmap.get(x.id)||0)>=100?'done':'')+'" href="aula.html?id='+encodeURIComponent(x.id)+'"><span class="lesson-row-icon">'+((pmap.get(x.id)||0)>=100?'✓':i+1)+'</span><span><strong>'+esc(x.title)+'</strong><small>'+x.estimated_minutes+' min • +'+x.xp_reward+' XP</small></span><span>›</span></a>').join('');
  const blocks=Array.isArray(lesson.content)?lesson.content:[];
  let stage=0,totalStages=Math.max(1,blocks.length)+1;
  qs('#stepper').innerHTML=Array.from({length:totalStages},(_,i)=>'<span class="v3-step-dot '+(i===0?'current':'')+'" data-dot="'+i+'"></span>').join('');
  qs('#stages').innerHTML=blocks.length?blocks.map((b,i)=>{const raw=typeof b==='string'?b:(b.text||b.content||JSON.stringify(b));const parts=raw.split(' — ');const head=parts.length>1?parts.shift():'Etapa '+(i+1);const body=parts.length?parts.join(' — '):raw;return '<section class="v3-stage '+(i?'hidden-stage':'')+'" data-stage="'+i+'"><div class="stage-label">ETAPA '+(i+1)+' DE '+blocks.length+'</div><h2>'+esc(head)+'</h2><p>'+esc(body)+'</p><div class="v3-stage-actions"><button class="v3-btn secondary" type="button" data-prev-stage '+(i===0?'disabled':'')+'>← Anterior</button><button class="v3-btn" type="button" data-next-stage>'+(i===blocks.length-1?'Ir para laboratório →':'Entendi, continuar →')+'</button></div></section>'}).join(''):'<section class="v3-stage" data-stage="0"><div class="stage-label">ETAPA 1</div><h2>Objetivo</h2><p>'+esc(lesson.objective||'Execute o laboratório desta missão.')+'</p><div class="v3-stage-actions"><button class="v3-btn" type="button" data-next-stage>Ir para laboratório →</button></div></section>';
  function showStage(n){stage=Math.max(0,Math.min(blocks.length,n));qsa('[data-stage]').forEach(x=>x.classList.toggle('hidden-stage',Number(x.dataset.stage)!==stage));qsa('[data-dot]').forEach((x,i)=>{x.classList.toggle('done',i<stage);x.classList.toggle('current',i===stage)});qs('#labHost').style.display=stage===blocks.length?'block':'none';if(stage===blocks.length)qs('#labHost').scrollIntoView({behavior:'smooth',block:'start'})}
  qsa('[data-next-stage]').forEach(btn=>btn.onclick=()=>showStage(stage+1));qsa('[data-prev-stage]').forEach(btn=>btn.onclick=()=>showStage(stage-1));
  NexoraLabs.render(qs('#labHost'),{lesson,module,course});qs('#labHost').style.display='none';
  const completeBtn=qs('#completeBtn');if(currentDone){completeBtn.disabled=false;completeBtn.textContent='Missão concluída — avançar →'}else if(NexoraLabs.isComplete())completeBtn.disabled=false;
  window.addEventListener('nexora:lab-complete',()=>{completeBtn.disabled=false;const d=qsa('[data-dot]');if(d.length)d[d.length-1].classList.add('done')});
  const next=lessons[idx+1],prev=lessons[idx-1];qs('#prevBtn').href=prev?'aula.html?id='+encodeURIComponent(prev.id):'curso.html?id='+encodeURIComponent(course.id);
  completeBtn.onclick=async()=>{if(currentDone){location.href=next?'aula.html?id='+encodeURIComponent(next.id):'curso.html?id='+encodeURIComponent(course.id);return}completeBtn.disabled=true;completeBtn.textContent='Salvando progresso...';try{const out=await NexoraSupabase.completeLesson(id);const msg=qs('#completeMsg');msg.style.display='block';msg.className='v3-feedback ok';msg.textContent='Missão concluída! +'+out.xp_awarded+' XP • Nível '+out.level+' • sequência de '+out.current_streak+' dia(s).';await loadGamification();setTimeout(()=>location.href=next?'aula.html?id='+encodeURIComponent(next.id):'curso.html?id='+encodeURIComponent(course.id),850)}catch(e){completeBtn.disabled=false;completeBtn.textContent='Tentar novamente';const msg=qs('#completeMsg');msg.style.display='block';msg.className='v3-feedback bad';msg.textContent=e.message}};
  const a=assess[0];qs('#quickLinks').innerHTML=(a?'<a class="quick-link" href="quiz.html?id='+encodeURIComponent(a.id)+'"><span>Quiz do módulo</span><span>→</span></a>':'')+'<a class="quick-link" href="projetos.html"><span>Boss Fight</span><span>→</span></a><a class="quick-link" href="biblioteca.html"><span>Materiais</span><span>→</span></a>';
  qs('#resourceList').innerHTML=resources.length?resources.slice(0,6).map(r=>'<article class="v3-material"><strong>'+esc(r.title)+'</strong><small>'+esc(r.summary||r.resource_type)+'</small></article>').join(''):'<div class="v3-empty">Os laboratórios desta missão já estão disponíveis acima. Materiais extras aparecerão aqui.</div>';
  state.classList.add('hidden');qs('#content').classList.remove('hidden');
 }catch(e){setState(state,'error','Não foi possível abrir a missão: '+e.message)}
})();
</script></body></html>
