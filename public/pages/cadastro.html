<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta — Nexora Academy</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><div class="login-page"><section class="login-hero"><div class="brand"><img src="../assets/brand/nexora-logo.svg" alt="Nexora Academy"></div><div class="eyebrow" style="margin-top:36px">COMECE AGORA</div><h1 class="hero-title">Sua jornada começa <span>aqui.</span></h1><p class="muted" style="font-size:18px;max-width:650px">Crie sua conta para acessar cursos, atividades, projetos, materiais e certificados em uma única plataforma.</p><div class="kpis" style="margin-top:22px"><span>Trilhas práticas</span><span>Avaliações</span><span>Portfólio</span><span>Progresso real</span></div></section><section class="login-panel"><div class="login-card"><div class="eyebrow">NEXORA ACADEMY</div><h2 style="font-size:30px;margin:8px 0">Criar conta</h2><p class="muted">Leva menos de um minuto.</p><form id="form"><label>Nome</label><input id="name" required minlength="2"><label>E-mail</label><input id="email" type="email" required><label>Senha</label><input id="password" type="password" required minlength="8"><button id="submit" class="btn" style="width:100%;margin-top:16px">Criar conta →</button><div id="msg" style="margin-top:12px"></div></form><p class="muted" style="text-align:center;margin-top:16px"><a href="login.html" style="color:#4da3ff">Já tenho conta</a></p></div></section></div><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script>form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;setState(msg,'loading','Criando conta');try{const r=await NexoraSupabase.signUp({name:name.value,email:email.value,password:password.value});if(r.access_token){await NexoraSupabase.api('/api/nexora/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:name.value})});location.replace('dashboard.html')}else{setState(msg,'success','Conta criada. Confirme seu e-mail para continuar.');submit.disabled=false}}catch(err){setState(msg,'error',err.message);submit.disabled=false}};</script></body></html>
