erfil.html"><span>⚙</span><span>Perfil</span></a></nav></main></div><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script src="../assets/js/app-shell.js"></script><script>(async()=>{const ctx=await nexoraBoot("profile");if(!ctx)return;qs("#name").value=ctx.profile?.full_name||ctx.name;qs("#email").value=ctx.u.email||"";qs("#save").onclick=async()=>{try{await NexoraSupabase.rest(`profiles?id=eq.${encodeURIComponent(ctx.u.id)}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({full_name:qs("#name").value})});setState(qs("#msg"),"success","Nome atualizado.")}catch(e){setState(qs("#msg"),"error",e.message)}}})();</script></body></html>
