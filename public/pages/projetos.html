<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projetos — Nexora</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand">NEXORA <span>ACADEMY</span></div><nav><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Visão geral</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Projetos</span></a><a data-nav="library" href="biblioteca.html"><span>▥</span><span>Biblioteca</span></a><a data-nav="certs" href="certificados.html"><span>▣</span><span>Certificados</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav><div class="side-footer">AI Builder<br>Aprenda construindo.</div></aside><main class="main"><header class="mobile-header"><div class="brand">NEXORA <span>ACADEMY</span></div><button class="btn-ghost" data-logout>Sair</button></header><div class="main-inner"><div class="topbar"><div><div class="eyebrow">PROJETOS</div><h1>Projetos práticos</h1><p class="muted">Construa, envie e acompanhe seus projetos.</p></div></div><div id="state" class="loading">Carregando projetos</div><div id="grid" class="grid-2 hidden"></div></div><nav class="bottom-nav"><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Início</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Projetos</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav></main></div><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script src="../assets/js/app-shell.js"></script><script>(async()=>{const ctx=await nexoraBoot("projects");if(!ctx)return;try{const rows=await NexoraSupabase.rest("projects?select=id,title,briefing,status,course_id&order=created_at.asc");const g=qs("#grid");g.innerHTML=rows.length?rows.map(p=>`<article class="card card-pad"><div class="eyebrow">PROJETO</div><h2>${esc(p.title)}</h2><p class="muted">${esc(p.briefing||"")}</p><span class="badge ${p.status==="published"?"ok":"locked"}">${esc(p.status||"draft")}</span></article>`).join(""):`<div class="empty">Nenhum projeto disponível no momento.</div>`;qs("#state").classList.add("hidden");g.classList.remove("hidden")}catch(e){setState(qs("#state"),"error",e.message)}})();</script></body></html>
