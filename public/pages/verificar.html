<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificar certificado — Nexora Academy</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../assets/css/academy-v3.css"></head><body><main class="main"><div class="main-inner" style="max-width:760px;padding-top:50px"><div class="v3-hero"><img src="../assets/brand/nexora-logo.svg" alt="Nexora Academy" style="width:190px"><div class="eyebrow" style="margin-top:22px">VALIDAÇÃO PÚBLICA</div><h1 style="font-size:38px">Verifique um certificado</h1><p>Digite o código impresso no documento.</p><div class="v3-api-row" style="margin-top:15px"><input id="code" placeholder="Código de verificação"><button id="check" class="v3-btn" type="button">Verificar</button></div><div id="result" class="v3-feedback" style="display:none"></div></div></div></main><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script>
(async()=>{const input=qs('#code'),btn=qs('#check'),res=qs('#result');input.value=new URLSearchParams(location.search).get('code')||'';async function check(){const code=input.value.trim();if(!code)return;btn.disabled=true;try{const r=await NexoraSupabase.rpc('verify_certificate',{p_code:code});const v=Array.isArray(r)?r[0]:r;res.style.display='block';if(v?.valid){res.className='v3-feedback ok';res.innerHTML='<b>Certificado válido</b><br>'+esc(v.student_name)+'<br>'+esc(v.course_title)+'<br>Emitido em '+new Date(v.issued_at).toLocaleDateString('pt-BR')}else{res.className='v3-feedback bad';res.textContent='Código não encontrado.'}}catch(e){res.style.display='block';res.className='v3-feedback bad';res.textContent='Código não encontrado.'}finally{btn.disabled=false}}btn.onclick=check;if(input.value)check()})();
</script></body></html>
