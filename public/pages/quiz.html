<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkpoint — Nexora Academy</title><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../assets/css/academy-v3.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><img src="../assets/brand/nexora-logo.svg" alt="Nexora Academy"></div><nav><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Visão geral</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Boss Fights</span></a><a data-nav="library" href="biblioteca.html"><span>▥</span><span>Biblioteca</span></a><a data-nav="certs" href="certificados.html"><span>▣</span><span>Certificados</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav><div class="side-footer"></div></aside><main class="main"><header class="mobile-header"><div class="brand"><img src="../assets/brand/nexora-logo.svg" alt="Nexora Academy"></div><button class="btn-ghost" data-logout>Sair</button></header><div class="main-inner"><div id="state" class="loading">Preparando checkpoint</div><section id="quiz" class="hidden v3-question-card"><div class="v3-mission-head"><div class="eyebrow">CHECKPOINT DE MÚLTIPLA ESCOLHA</div><h1 id="title"></h1><p class="muted" id="meta"></p><div class="v3-quiz-progress"><span id="bar" style="width:0%"></span></div><div class="v3-hud"><span class="v3-pill">Nota mínima <b id="pass">70%</b></span><span class="v3-pill xp">+150 XP ao aprovar</span></div></div><article class="v3-stage" style="margin-top:14px"><div class="v3-question-count" id="count">QUESTÃO 1</div><h2 id="prompt"></h2><div id="options" class="v3-mcq"></div><div id="feedback" class="v3-feedback">Escolha uma alternativa e clique em verificar.</div><div class="v3-stage-actions"><button id="verifyBtn" class="v3-btn" type="button">Verificar resposta</button><button id="nextBtn" class="v3-btn secondary" type="button" disabled>Próxima →</button></div></article><div id="result" style="display:none;margin-top:14px"></div></section></div><nav class="bottom-nav"><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Início</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Boss</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav></main></div><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script src="../assets/js/app-shell.js"></script><script>
(async()=>{const ctx=await nexoraBoot('courses');if(!ctx)return;const id=new URLSearchParams(location.search).get('id'),st=qs('#state');if(!id){setState(st,'error','Avaliação não informada.');return}try{const a=(await NexoraSupabase.rest('assessments?id=eq.'+encodeURIComponent(id)+'&status=eq.published&select=id,title,pass_score,max_attempts,module_id,course_id'))[0];if(!a)throw new Error('Avaliação não encontrada.');const questions=await NexoraSupabase.rest('questions?assessment_id=eq.'+encodeURIComponent(id)+'&select=id,prompt,question_type,options,position&order=position.asc');qs('#title').textContent=a.title;qs('#meta').textContent=questions.length+' questões • feedback imediato • até '+(a.max_attempts||3)+' tentativas';qs('#pass').textContent=Number(a.pass_score||70).toFixed(0)+'%';let idx=0;const answers={},validated=new Set();function paint(){const q=questions[idx];qs('#count').textContent='QUESTÃO '+(idx+1)+' DE '+questions.length;qs('#prompt').textContent=q.prompt;qs('#options').innerHTML=(Array.isArray(q.options)?q.options:[]).map(o=>'<label class="v3-option"><input type="radio" name="answer" value="'+esc(o.id)+'"><span>'+esc(o.label)+'</span></label>').join('');qsa('.v3-option').forEach(x=>x.onclick=()=>{qsa('.v3-option').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});const saved=answers[q.id];if(saved){const inp=qs('input[value="'+saved+'"]');if(inp){inp.checked=true;inp.closest('.v3-option').classList.add('selected')}}qs('#feedback').className='v3-feedback';qs('#feedback').textContent=validated.has(q.id)?'Resposta validada.':'Escolha uma alternativa e clique em verificar.';qs('#verifyBtn').disabled=validated.has(q.id);qs('#nextBtn').disabled=!validated.has(q.id);qs('#nextBtn').textContent=idx===questions.length-1?'Finalizar avaliação →':'Próxima →';qs('#bar').style.width=Math.round(validated.size/questions.length*100)+'%'}qs('#verifyBtn').onclick=async()=>{const q=questions[idx],sel=qs('input[name="answer"]:checked');if(!sel){qs('#feedback').className='v3-feedback bad';qs('#feedback').textContent='Escolha uma alternativa.';return}answers[q.id]=sel.value;qs('#verifyBtn').disabled=true;qs('#verifyBtn').textContent='Verificando...';try{const r=await NexoraSupabase.rpc('check_assessment_question',{p_question_id:q.id,p_option_id:sel.value}),out=Array.isArray(r)?r[0]:r;if(out.correct){validated.add(q.id);qsa('.v3-option').forEach(o=>{const i=o.querySelector('input');o.classList.toggle('correct',i.value===sel.value)});qs('#feedback').className='v3-feedback ok';qs('#feedback').textContent=out.feedback||'Correto.';qs('#nextBtn').disabled=false;qs('#bar').style.width=Math.round(validated.size/questions.length*100)+'%'}else{qs('#feedback').className='v3-feedback bad';qs('#feedback').textContent=out.feedback||'Ainda não. Revise o conceito e tente outra alternativa.';qsa('.v3-option').forEach(o=>{const i=o.querySelector('input');if(i.value===sel.value)o.classList.add('wrong')});qs('#verifyBtn').disabled=false}}catch(e){qs('#feedback').className='v3-feedback bad';qs('#feedback').textContent=e.message;qs('#verifyBtn').disabled=false}finally{qs('#verifyBtn').textContent='Verificar resposta'}};qs('#nextBtn').onclick=async()=>{if(idx<questions.length-1){idx++;paint();return}if(validated.size<questions.length)return;qs('#nextBtn').disabled=true;qs('#nextBtn').textContent='Calculando resultado...';try{const out=await NexoraSupabase.rpc('submit_assessment',{p_assessment_id:id,p_answers:answers}),r=Array.isArray(out)?out[0]:out;const box=qs('#result');box.style.display='block';box.className=r.passed?'v3-stage':'v3-stage';if(r.passed){let xp=0,level=Number(window.NexoraGamification?.level||ctx.gamification?.level||1),previousLevel=level;try{const x=await NexoraSupabase.rpc('claim_assessment_xp',{p_assessment_id:id}),xr=Array.isArray(x)?x[0]:x;xp=xr?.xp_awarded||0;level=xr?.level||level;if(xp)NexoraCelebrate({xp,level,previousLevel,title:'Checkpoint aprovado!',kind:'quiz',detail:'Você fechou este checkpoint com nota suficiente. O XP já foi creditado e o próximo desafio da trilha está liberado.'});await loadGamification()}catch{}box.innerHTML='<div class="eyebrow">CHECKPOINT CONCLUÍDO</div><h2>✓ Aprovado — '+Number(r.score).toFixed(0)+'%</h2><p class="muted">'+r.correct+' de '+r.total+' respostas corretas.'+(xp?' +'+xp+' XP adicionados.':' XP deste quiz já creditado anteriormente.')+'</p><div class="v3-toolbar"><a class="v3-btn" href="cursos.html">Voltar para a trilha →</a></div>'}else{box.innerHTML='<div class="eyebrow">RECUPERAÇÃO</div><h2>'+Number(r.score).toFixed(0)+'% — continue praticando</h2><p class="muted">A nota mínima é '+Number(a.pass_score||70).toFixed(0)+'%. Revise as missões do módulo e tente novamente.</p><div class="v3-toolbar"><button class="v3-btn" onclick="location.reload()">Tentar novamente</button><a class="v3-btn secondary" href="cursos.html">Voltar para a trilha</a></div>'}box.scrollIntoView({behavior:'smooth'})}catch(e){qs('#feedback').className='v3-feedback bad';qs('#feedback').textContent='Não foi possível finalizar: '+e.message;qs('#nextBtn').disabled=false;qs('#nextBtn').textContent='Tentar finalizar'}};paint();st.classList.add('hidden');qs('#quiz').classList.remove('hidden')}catch(e){setState(st,'error',e.message)}})();
</script></body></html>
