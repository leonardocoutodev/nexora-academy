<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaliação — Nexora Academy</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand">NEXORA ACADEMY</div><nav><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Visão geral</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Projetos</span></a><a data-nav="library" href="biblioteca.html"><span>▥</span><span>Biblioteca</span></a><a data-nav="certs" href="certificados.html"><span>▣</span><span>Certificados</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav><div class="side-footer"></div></aside><main class="main"><header class="mobile-header"><div class="brand">NEXORA ACADEMY</div><button class="btn-ghost" data-logout>Sair</button></header><div class="main-inner"><div id="state" class="loading">Carregando avaliação</div><section id="quiz" class="hidden" style="max-width:940px;margin:auto"><div class="card card-pad"><div class="eyebrow">AVALIAÇÃO</div><h1 id="title" style="margin:8px 0"></h1><p class="muted" id="meta"></p><div class="progress"><span id="bar" style="--progress:0%"></span></div></div><form id="form" style="margin-top:16px"></form><div class="card card-pad" style="margin-top:16px;display:flex;justify-content:space-between;gap:12px;align-items:center"><span class="muted" id="answered">0 respondidas</span><button class="btn" id="submitBtn" type="button">Enviar avaliação →</button></div><div id="result" class="hidden" style="margin-top:16px"></div></section></div><nav class="bottom-nav"><a data-nav="dashboard" href="dashboard.html"><span>⌂</span><span>Início</span></a><a data-nav="courses" href="cursos.html"><span>▤</span><span>Cursos</span></a><a data-nav="projects" href="projetos.html"><span>◇</span><span>Projetos</span></a><a data-nav="profile" href="perfil.html"><span>⚙</span><span>Perfil</span></a></nav></main></div><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-nexora.js"></script><script src="../assets/js/app-shell.js"></script><script>(async()=>{const ctx=await nexoraBoot('courses');if(!ctx)return;const id=new URLSearchParams(location.search).get('id'),state=qs('#state');if(!id){setState(state,'error','Avaliação não informada.');return}try{const a=(await NexoraSupabase.rest(`assessments?id=eq.${encodeURIComponent(id)}&status=eq.published&select=id,title,pass_score,max_attempts,module_id`))[0];if(!a)throw new Error('Avaliação não encontrada.');const questions=await NexoraSupabase.rest(`questions?assessment_id=eq.${encodeURIComponent(id)}&select=id,prompt,question_type,options,position&order=position.asc`);qs('#title').textContent=a.title;qs('#meta').textContent=`${questions.length} questões · nota mínima ${Number(a.pass_score||70)}% · até ${a.max_attempts||3} tentativas`;const f=qs('#form');f.innerHTML=questions.map((q,i)=>`<article class="card card-pad" style="margin-bottom:14px"><div class="eyebrow">QUESTÃO ${i+1} DE ${questions.length}</div><h3 style="margin:8px 0 14px">${esc(q.prompt)}</h3>${(Array.isArray(q.options)?q.options:[]).map(o=>`<label class="quiz-option"><input type="radio" name="q_${q.id}" value="${esc(o.id)}"> ${esc(o.label)}</label>`).join('')}</article>`).join('');const update=()=>{const n=qsa('input[type=radio]:checked').length;qs('#answered').textContent=`${n} de ${questions.length} respondidas`;qs('#bar').style.setProperty('--progress',`${questions.length?Math.round(n/questions.length*100):0}%`)};f.addEventListener('change',update);qs('#submitBtn').onclick=async()=>{const answers={};questions.forEach(q=>{const x=qs(`input[name="q_${q.id}"]:checked`);if(x)answers[q.id]=x.value});if(Object.keys(answers).length<questions.length){setState(qs('#result'),'error','Responda todas as questões antes de enviar.');qs('#result').classList.remove('hidden');return}qs('#submitBtn').disabled=true;qs('#submitBtn').textContent='Corrigindo...';try{const out=await NexoraSupabase.rest('rpc/submit_assessment',{method:'POST',body:JSON.stringify({p_assessment_id:id,p_answers:answers})});const r=Array.isArray(out)?out[0]:out;const el=qs('#result');el.className=r.passed?'success':'error';el.innerHTML=`<h2>${r.passed?'Aprovado!':'Continue praticando'}</h2><p>Resultado: <b>${Number(r.score).toFixed(0)}%</b> · ${r.correct} de ${r.total} respostas corretas.</p><a class="btn-secondary" href="cursos.html">Voltar aos cursos</a>`;el.classList.remove('hidden');qs('#submitBtn').textContent='Avaliação enviada'}catch(e){setState(qs('#result'),'error','Não foi possível enviar: '+e.message);qs('#result').classList.remove('hidden');qs('#submitBtn').disabled=false;qs('#submitBtn').textContent='Tentar novamente'}};state.classList.add('hidden');qs('#quiz').classList.remove('hidden')}catch(e){setState(state,'error',e.message)}})();</script></body></html>
