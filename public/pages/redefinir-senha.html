<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111F"><link rel="icon" type="image/svg+xml" href="../assets/brand/lc-mark.svg"><link rel="manifest" href="../manifest.webmanifest"><meta name="robots" content="noindex,nofollow"><title>Definir nova senha — LC</title><link rel="stylesheet" href="../assets/css/lc.css"></head><body data-lc-surface="auth" class="lc-public-page lc-auth-page lc-reset-page"><div class="login-page"><section class="login-hero"><a class="brand" href="../index.html"><img src="../assets/brand/lc-mark.svg" alt="LC"><span class="lc-brand-signature">Learn <span class="lc-brand-amp">&amp;</span> Create</span></a><div class="eyebrow lc-auth-eyebrow">SEGURANÇA DA CONTA</div><h1 class="hero-title">Crie uma nova <span>senha.</span></h1><p class="muted lc-auth-lead">Use uma senha forte e exclusiva para proteger seu progresso, projetos e certificados.</p></section><section class="login-panel"><div class="login-card"><div class="eyebrow">NOVA SENHA</div><h2 class="lc-auth-title">Atualizar acesso</h2><div id="state" class="loading">Validando link de recuperação...</div><form id="resetForm" class="hidden"><label for="password">Nova senha</label><div class="nx-password-wrap"><input id="password" type="password" required minlength="10" autocomplete="new-password" aria-describedby="passwordHelp"><button class="nx-password-toggle" type="button" data-toggle="password" aria-pressed="false">Mostrar</button></div><small id="passwordHelp" class="muted lc-password-help">Pelo menos 10 caracteres, com maiúscula, minúscula, número e símbolo.</small><label for="confirm">Confirmar nova senha</label><div class="nx-password-wrap"><input id="confirm" type="password" required minlength="10" autocomplete="new-password"><button class="nx-password-toggle" type="button" data-toggle="confirm" aria-pressed="false">Mostrar</button></div><button id="submit" class="v3-btn lc-auth-submit">Salvar nova senha →</button><div id="msg" class="lc-auth-message" aria-live="polite"></div></form><p class="muted lc-auth-switch"><a href="login.html">Voltar para entrar</a></p></div></section></div><script src="../assets/js/ui.js"></script><script src="../assets/js/supabase-lc.js"></script><script src="../assets/js/analytics.js"></script><script>(async()=>{const state=qs('#state'),form=qs('#resetForm'),password=qs('#password'),confirm=qs('#confirm'),submit=qs('#submit'),msg=qs('#msg');qsa('[data-toggle]').forEach(btn=>btn.onclick=()=>{const input=qs('#'+btn.dataset.toggle),show=input.type==='password';input.type=show?'text':'password';btn.textContent=show?'Ocultar':'Mostrar';btn.setAttribute('aria-pressed',String(show))});try{const valid=await LCSupabase.acceptRecoveryFromUrl();if(!valid)throw new Error('Este link não contém uma sessão de recuperação válida.');state.classList.add('hidden');form.classList.remove('hidden')}catch(err){setState(state,'error','Link de recuperação inválido ou expirado. Solicite um novo e-mail.')}form.onsubmit=async e=>{e.preventDefault();if(password.value!==confirm.value){setState(msg,'error','As senhas não coincidem.');confirm.focus();return}submit.disabled=true;setState(msg,'loading','Atualizando senha...');try{await LCSupabase.updatePassword(password.value);await LCAnalytics.track('password_reset_completed');await LCSupabase.signOut();form.classList.add('hidden');setState(state,'success','Senha atualizada com sucesso. Agora entre usando a nova senha.')}catch(err){setState(msg,'error',err.message);submit.disabled=false}}})();</script></body></html>
