<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Anatomia de um prompt profissional"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050b18"/><stop offset="1" stop-color="#0b1330"/></linearGradient><linearGradient id="g"><stop stop-color="#58cfff"/><stop offset=".5" stop-color="#6c6aff"/><stop offset="1" stop-color="#ad65ff"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="600" y="74" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="900">ANATOMIA DE UM PROMPT PROFISSIONAL</text><text x="600" y="108" text-anchor="middle" fill="#98afc7" font-family="Inter,Arial" font-size="17">Transforme pedidos vagos em instruções verificáveis.</text><g font-family="Inter,Arial" font-weight="800"><g transform="translate(55 160)"><rect width="315" height="100" rx="16" fill="#0b1b31" stroke="#4dafff"/><text x="20" y="31" fill="#74caff" font-size="18">1 • OBJETIVO</text><text x="20" y="61" fill="#fff" font-size="17">O que deve ser produzido?</text><text x="20" y="84" fill="#8fa8c0" font-size="14">Ex.: analisar, resumir, criar</text></g><g transform="translate(55 285)"><rect width="315" height="100" rx="16" fill="#11172f" stroke="#846aff"/><text x="20" y="31" fill="#b19eff" font-size="18">2 • CONTEXTO / FONTE</text><text x="20" y="61" fill="#fff" font-size="17">Quais fatos podem ser usados?</text><text x="20" y="84" fill="#8fa8c0" font-size="14">Defina a fonte de verdade</text></g><g transform="translate(55 410)"><rect width="315" height="100" rx="16" fill="#0a2124" stroke="#42d3a8"/><text x="20" y="31" fill="#72e8c4" font-size="18">3 • RESTRIÇÕES</text><text x="20" y="61" fill="#fff" font-size="17">O que não pode acontecer?</text><text x="20" y="84" fill="#8fa8c0" font-size="14">Não invente dados ausentes</text></g><g transform="translate(830 160)"><rect width="315" height="100" rx="16" fill="#0b1b31" stroke="#4dafff"/><text x="20" y="31" fill="#74caff" font-size="18">4 • FORMATO</text><text x="20" y="61" fill="#fff" font-size="17">Como a resposta deve chegar?</text><text x="20" y="84" fill="#8fa8c0" font-size="14">Tabela, JSON, lista, etapas</text></g><g transform="translate(830 285)"><rect width="315" height="100" rx="16" fill="#11172f" stroke="#846aff"/><text x="20" y="31" fill="#b19eff" font-size="18">5 • CRITÉRIOS</text><text x="20" y="61" fill="#fff" font-size="17">Como medir qualidade?</text><text x="20" y="84" fill="#8fa8c0" font-size="14">Precisão, clareza, cobertura</text></g><g transform="translate(830 410)"><rect width="315" height="100" rx="16" fill="#0a2124" stroke="#42d3a8"/><text x="20" y="31" fill="#72e8c4" font-size="18">6 • EXEMPLO</text><text x="20" y="61" fill="#fff" font-size="17">Mostre o padrão esperado</text><text x="20" y="84" fill="#8fa8c0" font-size="14">Útil quando a estrutura é específica</text></g></g><g transform="translate(492 222)"><circle cx="108" cy="108" r="100" fill="#0b1840" stroke="url(#g)" stroke-width="5"/><circle cx="108" cy="108" r="70" fill="none" stroke="#4d8aff" stroke-opacity=".4"/><text x="108" y="102" text-anchor="middle" fill="#75d5ff" font-family="Inter,Arial" font-size="27" font-weight="900">PROMPT</text><text x="108" y="134" text-anchor="middle" fill="#c7d6e6" font-family="Inter,Arial" font-size="17">CONTROLÁVEL</text></g><g fill="none" stroke="url(#g)" stroke-width="3" opacity=".8"><path d="M370 210h110M370 335h110M370 460h110M720 210h110M720 335h110M720 460h110"/></g><rect x="240" y="570" width="720" height="56" rx="14" fill="#071526" stroke="#2a4d76"/><text x="600" y="606" text-anchor="middle" fill="#dceaff" font-family="Inter,Arial" font-size="19" font-weight="800">Objetivo + Fonte + Restrições + Formato + Critérios + Exemplo = saída mais verificável</text></svg>