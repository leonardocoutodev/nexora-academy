<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Fluxo RAG e automação"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#04101d"/><stop offset="1" stop-color="#0a1030"/></linearGradient><linearGradient id="g"><stop stop-color="#4ee0c4"/><stop offset=".5" stop-color="#3faeff"/><stop offset="1" stop-color="#8c67ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7"/></filter></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="62" y="76" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="900">RAG: RECUPERAR ANTES DE RESPONDER</text><text x="62" y="108" fill="#94acc4" font-family="Inter,Arial" font-size="17">A resposta deve nascer da evidência recuperada, não de adivinhação.</text><g font-family="Inter,Arial" font-weight="800"><g transform="translate(65 185)"><rect width="225" height="310" rx="20" fill="#07192a" stroke="#398fd7"/><text x="24" y="39" fill="#72caff" font-size="18">1 • PERGUNTA</text><rect x="24" y="70" width="177" height="88" rx="12" fill="#04101d" stroke="#1f4669"/><text x="41" y="101" fill="#fff" font-size="15">“Posso compartilhar</text><text x="41" y="126" fill="#fff" font-size="15">minha senha?”</text><text x="24" y="202" fill="#7f98b2" font-size="14">Objetivo</text><text x="24" y="229" fill="#dbe8f5" font-size="16">Encontrar a regra</text><text x="24" y="254" fill="#dbe8f5" font-size="16">mais relevante</text></g><g transform="translate(355 185)"><rect width="235" height="310" rx="20" fill="#09172c" stroke="#6c68ff"/><text x="24" y="39" fill="#aca0ff" font-size="18">2 • RECUPERAÇÃO</text><g transform="translate(24 68)"><rect width="187" height="54" rx="10" fill="#07101e" stroke="#35547c"/><text x="14" y="22" fill="#6d8aa7" font-size="12">CHUNK A</text><text x="14" y="41" fill="#c9d7e5" font-size="13">Política de férias...</text><rect y="70" width="187" height="54" rx="10" fill="#0a1f32" stroke="#45c8ae"/><text x="14" y="92" fill="#6ee4c6" font-size="12">CHUNK B • RELEVANTE</text><text x="14" y="111" fill="#fff" font-size="13">Credenciais são individuais...</text><rect y="140" width="187" height="54" rx="10" fill="#07101e" stroke="#35547c"/><text x="14" y="162" fill="#6d8aa7" font-size="12">CHUNK C</text><text x="14" y="181" fill="#c9d7e5" font-size="13">Reembolso...</text></g></g><g transform="translate(655 185)"><rect width="215" height="310" rx="20" fill="#071a2b" stroke="#44d5b4"/><text x="24" y="39" fill="#6be4c5" font-size="18">3 • CONTEXTO</text><path d="M35 92h145M35 126h126M35 160h153M35 194h105" stroke="#5fd9c0" stroke-width="8" stroke-linecap="round" opacity=".5"/><text x="24" y="248" fill="#fff" font-size="16">Só entra o que</text><text x="24" y="272" fill="#fff" font-size="16">tem evidência.</text></g><g transform="translate(935 185)"><rect width="205" height="310" rx="20" fill="#09172d" stroke="#536dff"/><text x="24" y="39" fill="#89a0ff" font-size="18">4 • RESPOSTA</text><rect x="24" y="72" width="157" height="122" rx="12" fill="#07101d" stroke="#2d4b73"/><path d="M42 100h122M42 125h105M42 150h115" stroke="#6b8eff" stroke-width="7" stroke-linecap="round"/><text x="24" y="235" fill="#6ee2c2" font-size="14">✓ Fonte visível</text><text x="24" y="263" fill="#6ee2c2" font-size="14">✓ Sem invenção</text></g></g><g fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round"><path d="M290 340h65M590 340h65M870 340h65"/></g><g fill="#63cfff"><path d="M347 330l15 10-15 10z"/><path d="M647 330l15 10-15 10z"/><path d="M927 330l15 10-15 10z"/></g><rect x="255" y="550" width="690" height="66" rx="15" fill="#071725" stroke="#28507a"/><text x="600" y="590" text-anchor="middle" fill="#dbe9f7" font-family="Inter,Arial" font-size="19" font-weight="800">Se não houver evidência suficiente, a resposta correta é dizer que não há base para afirmar.</text></svg>