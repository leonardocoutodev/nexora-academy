<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Componentes, estado e React"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#04101d"/><stop offset="1" stop-color="#08142a"/></linearGradient><linearGradient id="g"><stop stop-color="#4cd6ff"/><stop offset=".5" stop-color="#4d88ff"/><stop offset="1" stop-color="#61e2bf"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="60" y="76" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="900">REACT: COMPONENTES + ESTADO + RENDERIZAÇÃO</text><text x="60" y="109" fill="#94acc4" font-family="Inter,Arial" font-size="17">A interface deve refletir o estado — sem duplicar a fonte de verdade.</text><g font-family="Inter,Arial" font-weight="800"><g transform="translate(82 178)"><rect width="330" height="330" rx="22" fill="#071725" stroke="#377fd0"/><text x="26" y="38" fill="#6ec8ff" font-size="17">App.jsx</text><text x="26" y="82" fill="#9c8cff" font-family="monospace" font-size="16">const [busca, setBusca]</text><text x="26" y="112" fill="#fff" font-family="monospace" font-size="16">= useState("")</text><text x="26" y="165" fill="#5ee1b8" font-family="monospace" font-size="16">const filtrados = cursos</text><text x="26" y="195" fill="#fff" font-family="monospace" font-size="16">.filter(...)</text><text x="26" y="248" fill="#6ec8ff" font-family="monospace" font-size="16">filtrados.map(c =&gt;</text><text x="26" y="278" fill="#fff" font-family="monospace" font-size="16">&lt;CursoCard key={c.id}/&gt;)</text></g><g transform="translate(520 140)"><rect x="95" y="0" width="220" height="75" rx="18" fill="#0b2340" stroke="#4bb7ff"/><text x="205" y="46" text-anchor="middle" fill="#fff" font-size="20">&lt;App /&gt;</text><path d="M205 75v58M205 133h-120v56M205 133h120v56" fill="none" stroke="url(#g)" stroke-width="4"/><rect x="0" y="188" width="170" height="82" rx="16" fill="#0a1830" stroke="#7265ff"/><rect x="240" y="188" width="170" height="82" rx="16" fill="#081d29" stroke="#38d0a9"/><text x="85" y="238" text-anchor="middle" fill="#b6a8ff" font-size="17">&lt;Header /&gt;</text><text x="325" y="238" text-anchor="middle" fill="#78e4c5" font-size="17">&lt;Lista /&gt;</text><path d="M325 270v58M325 328h-95v48M325 328h95v48" fill="none" stroke="#50c8e8" stroke-width="4"/><rect x="150" y="376" width="160" height="78" rx="16" fill="#081827" stroke="#408bd1"/><rect x="340" y="376" width="160" height="78" rx="16" fill="#081827" stroke="#408bd1"/><text x="230" y="424" text-anchor="middle" fill="#d9e8f5" font-size="16">&lt;Card /&gt;</text><text x="420" y="424" text-anchor="middle" fill="#d9e8f5" font-size="16">&lt;Card /&gt;</text></g></g><rect x="210" y="555" width="780" height="64" rx="15" fill="#071625" stroke="#285078"/><text x="600" y="593" text-anchor="middle" fill="#dceafa" font-family="Inter,Arial" font-size="19" font-weight="800">Estado muda → React calcula a nova UI → componentes recebem props → lista usa key estável</text></svg>