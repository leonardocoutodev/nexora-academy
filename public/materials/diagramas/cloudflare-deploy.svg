<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="28" fill="#071426"/><text x="70" y="75" fill="#fff" font-family="Arial" font-size="38" font-weight="700">Fluxo de deploy com Cloudflare Workers</text><text x="70" y="112" fill="#9fb4ce" font-family="Arial" font-size="20">Do código local até uma URL pública, com configuração e secrets separados.</text><g font-family="Arial" text-anchor="middle"><rect x="65" y="220" width="190" height="150" rx="20" fill="#102b54" stroke="#3188ff"/><text x="160" y="260" fill="#58a6ff" font-size="19" font-weight="700">1. CÓDIGO</text><text x="160" y="305" fill="#fff" font-size="18">worker.js</text><text x="160" y="338" fill="#fff" font-size="18">frontend</text><rect x="300" y="220" width="190" height="150" rx="20" fill="#102b54" stroke="#3188ff"/><text x="395" y="260" fill="#58a6ff" font-size="19" font-weight="700">2. WRANGLER</text><text x="395" y="305" fill="#fff" font-size="18">wrangler dev</text><text x="395" y="338" fill="#fff" font-size="18">teste local</text><rect x="535" y="220" width="190" height="150" rx="20" fill="#132747" stroke="#835cff"/><text x="630" y="260" fill="#a98cff" font-size="19" font-weight="700">3. CONFIG</text><text x="630" y="305" fill="#fff" font-size="18">vars</text><text x="630" y="338" fill="#fff" font-size="18">secrets</text><rect x="770" y="220" width="190" height="150" rx="20" fill="#0e3a31" stroke="#38d27d"/><text x="865" y="260" fill="#59e99a" font-size="19" font-weight="700">4. DEPLOY</text><text x="865" y="305" fill="#fff" font-size="18">wrangler deploy</text><text x="865" y="338" fill="#fff" font-size="18">nova versão</text><rect x="1005" y="220" width="130" height="150" rx="20" fill="#3a2811" stroke="#ffc857"/><text x="1070" y="260" fill="#ffd777" font-size="19" font-weight="700">5. URL</text><text x="1070" y="305" fill="#fff" font-size="18">produção</text><text x="1070" y="338" fill="#fff" font-size="18">logs</text><path d="M255 295h45M490 295h45M725 295h45M960 295h45" stroke="#4d75ff" stroke-width="7"/><rect x="165" y="465" width="870" height="120" rx="22" fill="#0b1c33" stroke="#254c79"/><text x="600" y="505" fill="#fff" font-size="22" font-weight="700">Secrets nunca entram no repositório</text><text x="600" y="543" fill="#b9c9dc" font-size="19">Use wrangler secret put para credenciais. Depois do deploy, valide /api/health e acompanhe logs.</text></g></svg>