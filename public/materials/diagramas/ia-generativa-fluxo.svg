<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#1f7aff"/><stop offset="1" stop-color="#7b5cff"/></linearGradient><style>text{font-family:Arial,sans-serif}.t{fill:#f7fbff;font-weight:700}.s{fill:#9fb5d0}.box{fill:#0c1b31;stroke:#27558f;stroke-width:2}.arrow{stroke:#54a3ff;stroke-width:5;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#54a3ff"/></marker></defs><rect width="1200" height="520" rx="28" fill="#07111f"/><text x="55" y="65" class="t" font-size="30">Como uma resposta de IA generativa é produzida</text><g transform="translate(50,145)"><rect class="box" width="190" height="150" rx="20"/><text x="95" y="58" text-anchor="middle" class="t" font-size="24">1. Entrada</text><text x="95" y="91" text-anchor="middle" class="s" font-size="18">prompt + contexto</text><text x="95" y="118" text-anchor="middle" class="s" font-size="18">+ arquivos</text></g><path class="arrow" d="M250 220 H335"/><g transform="translate(350,145)"><rect class="box" width="210" height="150" rx="20"/><text x="105" y="58" text-anchor="middle" class="t" font-size="24">2. Tokens</text><text x="105" y="91" text-anchor="middle" class="s" font-size="18">entrada quebrada</text><text x="105" y="118" text-anchor="middle" class="s" font-size="18">em unidades</text></g><path class="arrow" d="M570 220 H655"/><g transform="translate(670,145)"><rect class="box" width="210" height="150" rx="20"/><text x="105" y="58" text-anchor="middle" class="t" font-size="24">3. Modelo</text><text x="105" y="91" text-anchor="middle" class="s" font-size="18">calcula próximas</text><text x="105" y="118" text-anchor="middle" class="s" font-size="18">sequências prováveis</text></g><path class="arrow" d="M890 220 H975"/><g transform="translate(990,145)"><rect class="box" width="160" height="150" rx="20"/><text x="80" y="58" text-anchor="middle" class="t" font-size="24">4. Saída</text><text x="80" y="91" text-anchor="middle" class="s" font-size="18">texto, código,</text><text x="80" y="118" text-anchor="middle" class="s" font-size="18">imagem etc.</text></g><rect x="335" y="360" width="530" height="95" rx="18" fill="url(#g)" opacity=".2" stroke="#4a8fff"/><text x="600" y="398" text-anchor="middle" class="t" font-size="22">Ponto crítico: fluência não garante verdade</text><text x="600" y="430" text-anchor="middle" class="s" font-size="18">Valide fatos importantes com fontes, ferramentas ou revisão humana.</text></svg>