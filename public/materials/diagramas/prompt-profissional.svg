<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="28" fill="#071426"/><text x="70" y="80" fill="#fff" font-family="Arial" font-size="38" font-weight="700">Anatomia de um prompt profissional</text><text x="70" y="120" fill="#9fb4ce" font-family="Arial" font-size="20">Monte o pedido em blocos. Cada bloco elimina uma fonte comum de erro.</text><g font-family="Arial"><rect x="70" y="170" width="490" height="90" rx="18" fill="#102b54" stroke="#3188ff"/><text x="95" y="210" fill="#58a6ff" font-size="18" font-weight="700">1. OBJETIVO</text><text x="95" y="240" fill="#fff" font-size="20">O que deve ser produzido?</text><rect x="640" y="170" width="490" height="90" rx="18" fill="#102b54" stroke="#3188ff"/><text x="665" y="210" fill="#58a6ff" font-size="18" font-weight="700">2. CONTEXTO</text><text x="665" y="240" fill="#fff" font-size="20">Quais fatos e dados são confiáveis?</text><rect x="70" y="300" width="490" height="90" rx="18" fill="#102b54" stroke="#835cff"/><text x="95" y="340" fill="#a98cff" font-size="18" font-weight="700">3. RESTRIÇÕES</text><text x="95" y="370" fill="#fff" font-size="20">O que não pode acontecer?</text><rect x="640" y="300" width="490" height="90" rx="18" fill="#102b54" stroke="#835cff"/><text x="665" y="340" fill="#a98cff" font-size="18" font-weight="700">4. FORMATO</text><text x="665" y="370" fill="#fff" font-size="20">Como a resposta deve vir?</text><rect x="70" y="430" width="490" height="90" rx="18" fill="#0e3a31" stroke="#38d27d"/><text x="95" y="470" fill="#59e99a" font-size="18" font-weight="700">5. CRITÉRIO DE QUALIDADE</text><text x="95" y="500" fill="#fff" font-size="20">Como saber se ficou bom?</text><rect x="640" y="430" width="490" height="90" rx="18" fill="#3a2811" stroke="#ffc857"/><text x="665" y="470" fill="#ffd777" font-size="18" font-weight="700">6. DADO AUSENTE</text><text x="665" y="500" fill="#fff" font-size="20">Diga o que fazer quando faltar informação.</text><path d="M565 215h60M565 345h60M565 475h60" stroke="#4d75ff" stroke-width="5"/><rect x="210" y="570" width="780" height="70" rx="18" fill="#15213b"/><text x="600" y="613" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Objetivo + contexto + limites + formato + validação = prompt reutilizável</text></g></svg>