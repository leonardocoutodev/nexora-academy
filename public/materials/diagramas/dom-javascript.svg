<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="28" fill="#071426"/><text x="70" y="75" fill="#fff" font-family="Arial" font-size="38" font-weight="700">Como o JavaScript enxerga o HTML</text><text x="70" y="112" fill="#9fb4ce" font-family="Arial" font-size="20">O DOM transforma a página em uma árvore que pode ser selecionada e alterada.</text><g font-family="Arial" text-anchor="middle"><rect x="400" y="160" width="400" height="85" rx="18" fill="#102b54" stroke="#3188ff"/><text x="600" y="195" fill="#58a6ff" font-size="18" font-weight="700">document</text><text x="600" y="225" fill="#fff" font-size="20">Página atual</text><rect x="465" y="285" width="270" height="70" rx="16" fill="#132747"/><text x="600" y="327" fill="#fff" font-size="22">html</text><rect x="465" y="405" width="270" height="70" rx="16" fill="#132747"/><text x="600" y="447" fill="#fff" font-size="22">body</text><rect x="150" y="535" width="260" height="80" rx="16" fill="#0e3a31" stroke="#38d27d"/><text x="280" y="568" fill="#59e99a" font-size="18" font-weight="700">#titulo</text><text x="280" y="597" fill="#fff" font-size="18">&lt;h1&gt;Olá&lt;/h1&gt;</text><rect x="470" y="535" width="260" height="80" rx="16" fill="#0e3a31" stroke="#38d27d"/><text x="600" y="568" fill="#59e99a" font-size="18" font-weight="700">.texto</text><text x="600" y="597" fill="#fff" font-size="18">&lt;p&gt;Bem-vindo&lt;/p&gt;</text><rect x="790" y="535" width="260" height="80" rx="16" fill="#3a2811" stroke="#ffc857"/><text x="920" y="568" fill="#ffd777" font-size="18" font-weight="700">#botao</text><text x="920" y="597" fill="#fff" font-size="18">&lt;button&gt;Clique&lt;/button&gt;</text><path d="M600 245v40M600 355v50M600 475v30M600 505L280 535M600 505v30M600 505L920 535" stroke="#4d75ff" stroke-width="5" fill="none"/><rect x="70" y="190" width="245" height="190" rx="18" fill="#0b1c33" stroke="#254c79"/><text x="192" y="230" fill="#58a6ff" font-size="17" font-weight="700">SELECIONAR</text><text x="192" y="270" fill="#fff" font-size="17">getElementById()</text><text x="192" y="305" fill="#fff" font-size="17">querySelector()</text><text x="192" y="340" fill="#fff" font-size="17">querySelectorAll()</text><rect x="885" y="190" width="245" height="190" rx="18" fill="#0b1c33" stroke="#254c79"/><text x="1007" y="230" fill="#a98cff" font-size="17" font-weight="700">ALTERAR</text><text x="1007" y="270" fill="#fff" font-size="17">textContent</text><text x="1007" y="305" fill="#fff" font-size="17">classList</text><text x="1007" y="340" fill="#fff" font-size="17">addEventListener()</text></g></svg>