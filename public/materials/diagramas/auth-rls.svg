<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><defs><style>text{font-family:Arial,sans-serif}.t{fill:#fff;font-weight:700}.s{fill:#a8bbd2}.b{fill:#0d1c32;stroke:#28598f;stroke-width:2}.a{stroke:#54a5ff;stroke-width:5;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#54a5ff"/></marker></defs><rect width="1200" height="520" rx="28" fill="#07111f"/><text x="55" y="62" class="t" font-size="30">Autenticação + autorização + RLS</text><g transform="translate(55,145)"><rect class="b" width="190" height="145" rx="20"/><text x="95" y="55" text-anchor="middle" class="t" font-size="23">Login</text><text x="95" y="91" text-anchor="middle" class="s" font-size="18">quem é o usuário?</text></g><path class="a" d="M255 218H340"/><g transform="translate(355,145)"><rect class="b" width="210" height="145" rx="20"/><text x="105" y="55" text-anchor="middle" class="t" font-size="23">Sessão</text><text x="105" y="91" text-anchor="middle" class="s" font-size="18">identidade autenticada</text><text x="105" y="117" text-anchor="middle" class="s" font-size="18">+ token</text></g><path class="a" d="M575 218H665"/><g transform="translate(680,145)"><rect class="b" width="210" height="145" rx="20"/><text x="105" y="55" text-anchor="middle" class="t" font-size="23">Policy / RLS</text><text x="105" y="91" text-anchor="middle" class="s" font-size="18">o que ele pode</text><text x="105" y="117" text-anchor="middle" class="s" font-size="18">ler ou alterar?</text></g><path class="a" d="M900 218H985"/><g transform="translate(1000,145)"><rect class="b" width="145" height="145" rx="20"/><text x="72" y="55" text-anchor="middle" class="t" font-size="23">Dados</text><text x="72" y="91" text-anchor="middle" class="s" font-size="18">somente o</text><text x="72" y="117" text-anchor="middle" class="s" font-size="18">permitido</text></g><rect x="275" y="350" width="650" height="105" rx="18" fill="#0a2443" stroke="#387fd3"/><text x="600" y="392" text-anchor="middle" class="t" font-size="22">Autenticar não significa autorizar tudo</text><text x="600" y="424" text-anchor="middle" class="s" font-size="18">A sessão identifica. A policy decide o acesso a cada linha.</text></svg>