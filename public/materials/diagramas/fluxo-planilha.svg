<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="28" fill="#071426"/><text x="70" y="75" fill="#fff" font-family="Arial" font-size="38" font-weight="700">Fluxo correto para analisar uma planilha</text><text x="70" y="112" fill="#9fb4ce" font-family="Arial" font-size="20">A IA ajuda no raciocínio; os números precisam continuar verificáveis.</text><g font-family="Arial" text-anchor="middle"><rect x="65" y="210" width="185" height="150" rx="20" fill="#102b54" stroke="#3188ff"/><text x="157" y="255" fill="#58a6ff" font-size="18" font-weight="700">1. LIMPAR</text><text x="157" y="295" fill="#fff" font-size="18">datas</text><text x="157" y="325" fill="#fff" font-size="18">status</text><text x="157" y="355" fill="#fff" font-size="18">duplicatas</text><rect x="290" y="210" width="185" height="150" rx="20" fill="#102b54" stroke="#3188ff"/><text x="382" y="255" fill="#58a6ff" font-size="18" font-weight="700">2. CALCULAR</text><text x="382" y="295" fill="#fff" font-size="18">fórmulas</text><text x="382" y="325" fill="#fff" font-size="18">KPIs</text><text x="382" y="355" fill="#fff" font-size="18">filtros</text><rect x="515" y="210" width="185" height="150" rx="20" fill="#102b54" stroke="#835cff"/><text x="607" y="255" fill="#a98cff" font-size="18" font-weight="700">3. VALIDAR</text><text x="607" y="295" fill="#fff" font-size="18">conta manual</text><text x="607" y="325" fill="#fff" font-size="18">tabela dinâmica</text><text x="607" y="355" fill="#fff" font-size="18">amostras</text><rect x="740" y="210" width="185" height="150" rx="20" fill="#0e3a31" stroke="#38d27d"/><text x="832" y="255" fill="#59e99a" font-size="18" font-weight="700">4. INTERPRETAR</text><text x="832" y="295" fill="#fff" font-size="18">tendências</text><text x="832" y="325" fill="#fff" font-size="18">comparações</text><text x="832" y="355" fill="#fff" font-size="18">anomalias</text><rect x="965" y="210" width="170" height="150" rx="20" fill="#3a2811" stroke="#ffc857"/><text x="1050" y="255" fill="#ffd777" font-size="18" font-weight="700">5. EXPLICAR</text><text x="1050" y="295" fill="#fff" font-size="18">insight</text><text x="1050" y="325" fill="#fff" font-size="18">métrica</text><text x="1050" y="355" fill="#fff" font-size="18">evidência</text><path d="M250 285h40M475 285h40M700 285h40M925 285h40" stroke="#4d75ff" stroke-width="6"/><rect x="135" y="455" width="930" height="110" rx="22" fill="#0b1c33" stroke="#254c79"/><text x="600" y="500" fill="#fff" font-size="23" font-weight="700">Regra de ouro</text><text x="600" y="538" fill="#b9c9dc" font-size="20">Se o insight não aponta a métrica que o sustenta, ele ainda não está validado.</text></g></svg>