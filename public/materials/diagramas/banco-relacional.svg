<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="28" fill="#071426"/><text x="70" y="75" fill="#fff" font-family="Arial" font-size="38" font-weight="700">Como pensar um banco relacional</text><text x="70" y="112" fill="#9fb4ce" font-family="Arial" font-size="20">Entidades viram tabelas; relacionamentos viram chaves estrangeiras.</text><g font-family="Arial"><rect x="80" y="190" width="280" height="280" rx="20" fill="#102b54" stroke="#3188ff"/><text x="105" y="230" fill="#58a6ff" font-size="20" font-weight="700">ALUNOS</text><text x="105" y="275" fill="#fff" font-size="18">id  🔑 PK</text><text x="105" y="315" fill="#fff" font-size="18">nome</text><text x="105" y="355" fill="#fff" font-size="18">email</text><text x="105" y="395" fill="#fff" font-size="18">created_at</text><rect x="460" y="190" width="280" height="280" rx="20" fill="#132747" stroke="#835cff"/><text x="485" y="230" fill="#a98cff" font-size="20" font-weight="700">MATRÍCULAS</text><text x="485" y="275" fill="#fff" font-size="18">id  🔑 PK</text><text x="485" y="315" fill="#fff" font-size="18">aluno_id  → FK</text><text x="485" y="355" fill="#fff" font-size="18">curso_id  → FK</text><text x="485" y="395" fill="#fff" font-size="18">status</text><rect x="840" y="190" width="280" height="280" rx="20" fill="#0e3a31" stroke="#38d27d"/><text x="865" y="230" fill="#59e99a" font-size="20" font-weight="700">CURSOS</text><text x="865" y="275" fill="#fff" font-size="18">id  🔑 PK</text><text x="865" y="315" fill="#fff" font-size="18">titulo</text><text x="865" y="355" fill="#fff" font-size="18">carga_horaria</text><text x="865" y="395" fill="#fff" font-size="18">ativo</text><path d="M360 330h100M740 330h100" stroke="#4d75ff" stroke-width="7"/><polygon points="452,322 468,330 452,338" fill="#4d75ff"/><polygon points="832,322 848,330 832,338" fill="#4d75ff"/><rect x="190" y="535" width="820" height="90" rx="20" fill="#0b1c33" stroke="#254c79"/><t