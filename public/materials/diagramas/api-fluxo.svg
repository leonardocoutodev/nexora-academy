<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="28" fill="#071426"/><text x="70" y="75" fill="#fff" font-family="Arial" font-size="38" font-weight="700">O que acontece em uma chamada de API</text><text x="70" y="112" fill="#9fb4ce" font-family="Arial" font-size="20">Request entra, a API valida, processa e devolve uma resposta com status e dados.</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="230" width="240" height="170" rx="22" fill="#102b54" stroke="#3188ff"/><text x="190" y="270" fill="#58a6ff" font-size="20" font-weight="700">CLIENTE</text><text x="190" y="310" fill="#fff" font-size="18">Formulário</text><text x="190" y="340" fill="#fff" font-size="18">App / Frontend</text><text x="190" y="370" fill="#fff" font-size="18">fetch()</text><rect x="480" y="190" width="240" height="250" rx="22" fill="#132747" stroke="#835cff"/><text x="600" y="230" fill="#a98cff" font-size="20" font-weight="700">API</text><text x="600" y="275" fill="#fff" font-size="18">1. autentica</text><text x="600" y="310" fill="#fff" font-size="18">2. valida</text><text x="600" y="345" fill="#fff" font-size="18">3. executa regra</text><text x="600" y="380" fill="#fff" font-size="18">4. acessa dados</text><text x="600" y="415" fill="#fff" font-size="18">5. responde</text><rect x="890" y="230" width="240" height="170" rx="22" fill="#0e3a31" stroke="#38d27d"/><text x="1010" y="270" fill="#59e99a" font-size="20" font-weight="700">BANCO / SERVIÇO</text><text x="1010" y="310" fill="#fff" font-size="18">consulta</text><text x="1010" y="340" fill="#fff" font-size="18">gravação</text><text x="1010" y="370" fill="#fff" font-size="18">integração externa</text><path d="M310 275h170" stroke="#4d75ff" stroke-width="7"/><text x="395" y="250" fill="#9fb4ce" font-size="16">POST /contacts</text><path d="M720 315h170" stroke="#4d75ff" stroke-width="7"/><path d="M890 355H720" stroke="#38d27d" stroke-width="7"/><path d="M480 365H310" stroke="#38d27d" stroke-width="7"/><text x="395" y="395" fill="#9fb4ce" font-size="16">201 + JSON</text><rect x="185" y="515" width="830" height="100" rx="20" fill="#0b1c33" stroke="#254c79"/><text x="600" y="555" fill="#fff" font-size="22" font-weight="700">Status HTTP diz o que aconteceu</text><text x="600" y="592" fill="#b9c9dc" font-size="18">201 criou • 400/422 entrada inválida • 401/403 acesso • 404 não existe • 500 falha interna</text></g></svg>